name: MoUI CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_slow_native_examples:
        description: Build current-platform Skia native examples on macOS and Linux.
        required: false
        default: false
        type: boolean

# One in-flight run per branch. A superseded pull-request run is cancelled;
# push runs on main/dev are never cancelled, so landing evidence is not dropped.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  moonbit-workspace-baseline:
    name: MoonBit workspace baseline
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          # Workspace builds take wzzc-dev/window from the registry; the 356 MB
          # window checkout is only needed by the window-hosted evidence jobs.
          submodules: "false"

      - name: Install dependencies
        run: |
          moon version --all
          sh scripts/ci-moon-update.sh

      # The workspace sweep compiles every member package natively, which is the
      # long pole of the PR critical path. It stays on macOS because it covers
      # the mainline Skia bindings; the public-interface drift check runs in the
      # same job so it reuses the warm build graph instead of a second full
      # compile on a second runner.
      - name: Run MoonBit workspace baseline
        run: |
          moon check
          node scripts/run-workspace-tests.mjs
          node scripts/check-generated-interfaces.mjs

  pr-profile:
    name: PR profile gate
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          submodules: "false"

      - name: Install dependencies
        run: |
          moon version --all
          sh scripts/ci-moon-update.sh

      - name: Run PR check profile
        run: sh scripts/check.sh --profile pr --skip-submodule-init

  linux-platform:
    name: Linux platform contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The platform profile compiles the Linux window backends
      # (wzzc-dev/window X11 + Wayland cores), links the GLib/zlib
      # service stubs, and resolves the Skia renderer stack, so the
      # full documented dependency set is required — Wayland alone is
      # not enough (X11/Xatom.h, gio/glib.h, libvulkan, fontconfig).
      - name: Install native Linux dependencies
        run: bash scripts/set_linux_deps.sh

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          submodules: "false"

      - name: Install dependencies
        run: |
          moon version --all
          sh scripts/ci-moon-update.sh

      - name: Run Linux platform profile
        run: sh scripts/check.sh --profile platform --skip-submodule-init

      - name: Build Linux native examples
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_slow_native_examples }}
        run: |
          moon build examples/showcase/linux_skia --target native

  macos-packaging:
    name: macOS packaging smoke
    runs-on: macos-latest
    timeout-minutes: 15
    # Packaging is a landing check, not a review-time check: it is the most
    # macOS-minute-heavy step per unit of signal and its failure mode (bundle
    # layout) is not something a code review changes. Pull requests get the
    # package build only through the explicit dispatch input.
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          submodules: "false"

      - name: Install dependencies
        run: |
          moon version --all
          sh scripts/ci-moon-update.sh

      - name: Package Showcase app bundle
        run: |
          sh scripts/package-macos-app.sh \
            --package examples/showcase/macos_skia \
            --name "MoUI Showcase" \
            --bundle-id dev.wzzc.moui.showcase \
            --version 0.1.0 \
            --build-version "$GITHUB_RUN_NUMBER"

      - name: Build macOS native examples
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_slow_native_examples }}
        run: |
          moon build examples/showcase/macos_skia --target native

      - name: Upload macOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: moui-showcase-macos-app
          path: dist/macos/MoUI Showcase.app
          if-no-files-found: error

  benchmark-scaffold:
    name: Benchmark scaffold
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          submodules: "false"

      - name: Install dependencies
        run: |
          moon version --all
          sh scripts/ci-moon-update.sh

      - name: Build benchmark targets
        run: node scripts/conformance-capture-scaffold.mjs --mode benchmark

      # Structural build/cache counters are machine-independent and block here.
      # Wall-clock budgets stay report-only until repeated artifacts establish
      # the variance rule in checks/performance-budgets.json.
      - name: Run performance budgets (blocking structural gate)
        run: node scripts/run-performance-budgets.mjs --structural-only

      - name: Review timing budgets (non-blocking report)
        continue-on-error: true
        run: node scripts/validate-performance-budgets.mjs --results artifacts/performance/result.json

      - name: Upload performance report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: moui-performance-budgets
          path: artifacts/performance/result.json
          if-no-files-found: error

  agent-protocol-smoke:
    name: Agent MCP protocol smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          submodules: "false"

      - name: Install dependencies
        run: |
          moon version --all
          sh scripts/ci-moon-update.sh

      - name: Install Pillow
        run: python3 -m pip install --quiet --break-system-packages --upgrade Pillow

      # Runs the gate declared in smoke/gates.json rather than the script
      # directly, so the catalog stays the single source of truth for what CI
      # executes. It covers the real process boundary: request framing,
      # response ordering, and process exit.
      - name: Run agent MCP protocol smoke
        run: node scripts/smoke-gate.mjs --suite agent.mcp-counter-protocol --run

      - name: Upload agent protocol smoke artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: moui-agent-mcp-protocol-smoke
          path: artifacts/smoke/agent-mcp-counter-protocol/
          if-no-files-found: warn

  windows-native:
    name: Windows MSVC native smoke
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare wgpu-native
        uses: ./.github/actions/prepare-wgpu-native

      - name: Set up vcpkg zlib
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows\setup_msvc_deps.ps1 -InstallZlib -InstallWebView2

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          submodules: "false"

      - name: Install dependencies
        shell: bash
        run: |
          moon version --all
          sh scripts/ci-moon-update.sh

      - name: Verify Windows check wrapper plan
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows\check.ps1 -Profile Pr -DryRun -Json -SkipSubmoduleInit

      - name: Run Windows backend tests
        shell: pwsh
        run: |
          . .\scripts\windows\msvc_env.ps1
          moon test moui/backend/windows --target native
          Enable-MsvcC11Atomics
          moon check examples/showcase/windows_skia --target native

      - name: Build Showcase Windows Skia entrypoint with MSVC
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows\build_windows_msvc.ps1 -Package examples/showcase/windows_skia -BuildOnly

      - name: Package Showcase Windows Skia folder with MSVC
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\windows\package_windows_app_msvc.ps1 `
            -Package examples/showcase/windows_skia `
            -AppName MoUIShowcase `
            -Version 0.1.0 `
            -BuildNumber $env:GITHUB_RUN_NUMBER

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: moui-showcase-windows-msvc-portable
          path: dist/windows-msvc/MoUIShowcase
          if-no-files-found: error
