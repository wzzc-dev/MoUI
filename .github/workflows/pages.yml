name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MOUI_SKIA_MBT_REMOTE: https://github.com/wzzc-dev/skia_mbt.git

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libwayland-bin wayland-protocols pkg-config unzip \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev fonts-noto-color-emoji

      - name: Install dependencies
        run: |
          moon version --all
          sh scripts/ci-moon-update.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage website artifact
        run: |
          node scripts/package-web-app.mjs website/web_wasm --out dist/pages
          node scripts/package-web-app.mjs examples/showcase/web_wasm --out dist/pages/showcase
          node scripts/package-web-app.mjs examples/markdown_editor/web_wasm --out dist/pages/markdown-editor
          node scripts/package-website-playground.mjs --out dist/pages/playground
          node scripts/sync-website-docs.mjs --out dist/pages/docs

          test -f dist/pages/index.html
          test -f dist/pages/web_wasm.wasm
          test -f dist/pages/web_wasm.wasm.br
          test -f dist/pages/runtime.js
          test -f dist/pages/runtime.js.br
          test -f dist/pages/browser_runtime.js
          test -f dist/pages/browser_runtime.js.br
          test -f dist/pages/canvas2d_runtime.js
          test -f dist/pages/canvas2d_runtime.js.br
          test -f dist/pages/bundle-size.json
          test -f dist/pages/docs/architecture.md
          test -f dist/pages/docs/moui-readme.md
          test -f dist/pages/docs/moui-skia-readme.md
          test -f dist/pages/docs/catalog.json
          test -f dist/pages/docs/zh-Hans/catalog.json
          test -f dist/pages/docs/zh-Hans/architecture.md
          test -f dist/pages/docs/android-support.md
          test -f dist/pages/docs/ios-support.md
          test -f dist/pages/docs/harmonyos-support.md
          test -f dist/pages/robots.txt
          test -f dist/pages/sitemap.xml
          test -f dist/pages/showcase/index.html
          test -f dist/pages/showcase/web_wasm.wasm
          test -f dist/pages/showcase/runtime.js
          test -f dist/pages/showcase/browser_runtime.js
          test -f dist/pages/showcase/canvas2d_runtime.js
          test -f dist/pages/showcase/bundle-size.json
          test -f dist/pages/markdown-editor/index.html
          test -f dist/pages/markdown-editor/web_wasm.wasm
          test -f dist/pages/markdown-editor/runtime.js
          test -f dist/pages/markdown-editor/browser_runtime.js
          test -f dist/pages/markdown-editor/canvas2d_runtime.js
          test -f dist/pages/markdown-editor/bundle-size.json
          test -f dist/pages/playground/index.html
          test -f dist/pages/playground/playground.wasm
          test -f dist/pages/playground/runtime.js
          test -f dist/pages/playground/host/compiler-worker.js
          test -f dist/pages/playground/assets/moonc-web.cjs
          test -f dist/pages/playground/assets/moonc-worker.js
          test -f dist/pages/playground/assets/moonbit-core/core.core
          test -f dist/pages/playground/assets/manifest.json
          test -f dist/pages/playground/lessons/catalog.json
          grep -q 'from "./runtime.js"' dist/pages/index.html
          grep -q '"./web_wasm.wasm"' dist/pages/index.html
          ! grep -q '_build/wasm-gc' dist/pages/index.html
          grep -q 'from "./runtime.js"' dist/pages/showcase/index.html
          grep -q '"./web_wasm.wasm"' dist/pages/showcase/index.html
          ! grep -q '_build/wasm-gc' dist/pages/showcase/index.html
          grep -q 'from "./runtime.js"' dist/pages/markdown-editor/index.html
          grep -q '"./web_wasm.wasm"' dist/pages/markdown-editor/index.html
          ! grep -q '_build/wasm-gc' dist/pages/markdown-editor/index.html
          ! grep -q '_build' dist/pages/playground/index.html
          ! grep -q 'CodeMirror' dist/pages/playground/index.html
          node scripts/test-playground-assets.mjs --root dist/pages/playground

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    name: Deploy website
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
