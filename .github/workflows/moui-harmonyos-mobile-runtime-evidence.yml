name: MoUI HarmonyOS Mobile Runtime Evidence

on:
  workflow_dispatch:
    inputs:
      app:
        description: Mobile app id to smoke
        required: false
        default: component_gallery
        type: choice
        options:
          - component_gallery
          - harmonyos_demo
      renderer:
        description: Skia renderer selection
        required: false
        default: auto
        type: choice
        options:
          - auto
          - skia-gpu
          - skia-raster
      device:
        description: Optional hdc target override
        required: false
        default: ""
        type: string

jobs:
  harmonyos-mobile-runtime-evidence:
    name: HarmonyOS Component Gallery runtime smoke
    # Self-hosted only: DevEco SDK, hdc, and a signed commercial/HVD host.
    runs-on: [self-hosted, harmonyos]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Update MoonBit registry
        shell: bash
        run: scripts/ci-moon-update.sh

      - name: Preflight signing material
        shell: bash
        run: |
          if [ -z "${MOUI_HARMONYOS_SIGNING_CONFIG:-}" ] && [ -z "${MOUI_HARMONYOS_SIGNING_CONFIG_FILE:-}" ]; then
            echo "Self-hosted runner must provide MOUI_HARMONYOS_SIGNING_CONFIG(_FILE) for commercial devices." >&2
            exit 2
          fi

      - name: Run HarmonyOS mobile runtime evidence
        shell: bash
        env:
          MOUI_MOBILE_APP: ${{ inputs.app || 'component_gallery' }}
          MOUI_SKIA_RENDERER: ${{ inputs.renderer || 'auto' }}
          MOUI_HARMONYOS_DEVICE: ${{ inputs.device }}
        run: |
          chmod +x scripts/harmonyos-mobile-runtime-evidence.sh
          scripts/harmonyos-mobile-runtime-evidence.sh

      - name: Upload HarmonyOS mobile runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moui-harmonyos-mobile-runtime-evidence
          path: |
            artifacts/mobile-runtime/harmonyos/**
            artifacts/harmonyos/**
          if-no-files-found: warn
