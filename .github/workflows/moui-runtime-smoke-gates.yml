name: MoUI Runtime Smoke Gates

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      gate:
        description: Smoke gate tier to summarize.
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - release
      run_web_runtime_presentation:
        description: Run the browser-session Web runtime presentation smoke.
        required: false
        default: true
        type: boolean
      run_macos_real_skia:
        description: Run the macOS real-Skia release smoke.
        required: false
        default: false
        type: boolean

jobs:
  catalog:
    name: Smoke gate catalog
    runs-on: macos-14
    env:
      SMOKE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.gate || 'nightly' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate smoke gate catalog
        run: |
          node --check scripts/smoke-check.mjs
          node --check scripts/test-smoke-check.mjs
          node scripts/test-smoke-check.mjs
          node scripts/smoke-check.mjs --check
          node --check scripts/smoke-gate.mjs
          node --check scripts/test-smoke-gate.mjs
          node scripts/test-smoke-gate.mjs
          node scripts/smoke-gate.mjs --tier "$SMOKE_GATE" --dry-run --json

  web-runtime-presentation:
    name: Web runtime presentation smoke
    runs-on: macos-14
    needs: catalog
    if: ${{ github.event_name == 'schedule' || inputs.run_web_runtime_presentation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: |
          moon version --all
          sh scripts/ci-moon-update.sh

      - name: Run Web runtime presentation smoke
        run: node scripts/smoke-gate.mjs --suite web.runtime-presentation --run

      - name: Upload Web runtime presentation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-runtime-presentation-smoke
          path: artifacts/smoke/web-runtime-presentation/
          if-no-files-found: warn

  macos-real-skia:
    name: macOS real-Skia release smoke
    runs-on: macos-14
    needs: catalog
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macos_real_skia }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: |
          moon version --all
          sh scripts/ci-moon-update.sh

      - name: Run macOS real-Skia release smoke
        run: node scripts/smoke-gate.mjs --suite macos.skia-real-showcase-markdown --run

      - name: Upload macOS real-Skia smoke artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-real-skia-release-smoke
          path: |
            artifacts/platform-observation/macos/
            artifacts/example-smoke/macos/
          if-no-files-found: warn
