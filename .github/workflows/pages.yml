name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MOUI_WINDOW_REMOTE: https://github.com/wzzc-dev/window.git
  MOUI_SKIA_MBT_REMOTE: https://github.com/wzzc-dev/skia_mbt.git

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libwayland-bin wayland-protocols pkg-config unzip \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev fonts-noto-color-emoji

      - name: Restore local dependencies
        run: sh scripts/setup-local-deps.sh

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Build website wasm-gc target
        run: moon build website/web_wasm --target wasm-gc

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage website artifact
        run: |
          mkdir -p dist/pages
          cp website/web_wasm/index.html dist/pages/index.html
          if [ -d website/web_wasm/assets ]; then
            cp -R website/web_wasm/assets dist/pages/assets
          fi

          mkdir -p dist/pages/moui/backend/web
          cp moui/backend/web/runtime.js dist/pages/moui/backend/web/runtime.js
          cp moui/backend/web/browser_runtime.js dist/pages/moui/backend/web/browser_runtime.js

          mkdir -p dist/pages/_build/wasm-gc/debug/build/website/web_wasm
          cp _build/wasm-gc/debug/build/website/web_wasm/web_wasm.wasm \
            dist/pages/_build/wasm-gc/debug/build/website/web_wasm/web_wasm.wasm
          cp _build/wasm-gc/debug/build/website/web_wasm/web_wasm.wasm.map \
            dist/pages/_build/wasm-gc/debug/build/website/web_wasm/web_wasm.wasm.map

          sed -i 's#../../moui/backend/web/runtime.js#./moui/backend/web/runtime.js#' dist/pages/index.html
          sed -i 's#../../_build/wasm-gc/debug/build/website/web_wasm/web_wasm.wasm#./_build/wasm-gc/debug/build/website/web_wasm/web_wasm.wasm#' dist/pages/index.html

          test -f dist/pages/index.html
          test -f dist/pages/moui/backend/web/runtime.js
          test -f dist/pages/moui/backend/web/browser_runtime.js
          test -f dist/pages/_build/wasm-gc/debug/build/website/web_wasm/web_wasm.wasm

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    name: Deploy website
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
