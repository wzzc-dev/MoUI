name: MoUI External Consumer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  external-consumer:
    name: ${{ matrix.os }} / ${{ matrix.source }} / ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        source: [registry, package]
        profile: [base, skia, web]
        exclude:
          - source: registry
            profile: skia
          - source: registry
            profile: web
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libwayland-bin wayland-protocols pkg-config unzip \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev

      - name: Validate external consumer
        shell: bash
        run: |
          node scripts/validate-ecosystem-metadata.mjs
          node scripts/external-consumer-ci.mjs --source "${{ matrix.source }}" --profile "${{ matrix.profile }}"
