name: MoUI Shell Contracts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/moui-shell-contracts.yml"
      - "moui_shell/**"
      - "moui_cli/**"
      - "scripts/*-shell-runtime-evidence.sh"
      - "scripts/build-shell-*.sh"
      - "scripts/build-showcase-*.sh"
      - "scripts/check-shell-app-config.mjs"
      - "scripts/lib/shell-runtime-log.mjs"
      - "scripts/record-shell-runtime-smoke.mjs"
      - "scripts/test-validate-shell-runtime-manifest.mjs"
      - "scripts/validate-shell-runtime-manifest.mjs"
      - "scripts/setup-android-sdk.sh"
      - "tools/moui/validate_shell_runtime_manifest/**"
      - "examples/showcase/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/moui-shell-contracts.yml"
      - "moui_shell/**"
      - "moui_cli/**"
      - "scripts/*-shell-runtime-evidence.sh"
      - "scripts/build-shell-*.sh"
      - "scripts/build-showcase-*.sh"
      - "scripts/check-shell-app-config.mjs"
      - "scripts/lib/shell-runtime-log.mjs"
      - "scripts/record-shell-runtime-smoke.mjs"
      - "scripts/test-validate-shell-runtime-manifest.mjs"
      - "scripts/validate-shell-runtime-manifest.mjs"
      - "scripts/setup-android-sdk.sh"
      - "tools/moui/validate_shell_runtime_manifest/**"
      - "examples/showcase/**"
  workflow_dispatch:
    inputs:
      run_harmonyos_hvigor:
        description: Run the real managed/plugin Hvigor build on a HarmonyOS runner.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: moui-shell-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    name: Plugin, ABI, and shell static contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libwayland-bin wayland-protocols pkg-config \
            clang cmake ninja-build

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install MoonBit dependencies
        run: sh scripts/ci-moon-update.sh

      - name: Validate shell plugin and canonical contracts
        run: |
          node --test moui_shell/scripts/plugin-manifest.test.mjs moui_shell/scripts/shell-config-schema.test.mjs moui_shell/scripts/app-config.test.mjs
          node --test moui_shell/android/embedder/prepare-plugins.test.mjs moui_shell/android/runner/resolve-shell.test.mjs moui_shell/ios/runner/resolve-shell.test.mjs moui_shell/harmonyos/runner/tests/validate-managed-shell.mjs
          node --test moui_shell/test_probe/tests/validate-test-probe.mjs
          bash moui_shell/tests/run-embedding-api-v1-tests.sh
          node scripts/test-validate-shell-runtime-manifest.mjs
          moon test tools/moui/validate_shell_runtime_manifest --target native
          moon test moui_cli --target native

      - name: Reject generated artifact drift
        run: |
          git diff --exit-code
          if git status --short -- artifacts | grep -q .; then
            echo "shell CI must not create tracked artifacts" >&2
            exit 1
          fi

  android-shells:
    name: Android managed, ejected, and plugin shells
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install MoonBit dependencies
        run: sh scripts/ci-moon-update.sh

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libwayland-bin wayland-protocols pkg-config unzip \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev

      - name: Install Android SDK, NDK, and CMake
        run: scripts/setup-android-sdk.sh --accept-licenses

      - name: Build Android shell matrix
        shell: bash
        run: |
          eval "$(scripts/setup-android-sdk.sh --print-env)"
          moui_shell/test_probe/tests/run-shell-matrix.sh android --fallback-skia

      - name: Upload Android packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moui-android-shell-contracts
          path: artifacts/shell-ci/android/**
          if-no-files-found: warn

  ios-shells:
    name: iOS managed, ejected, and plugin shells
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install MoonBit dependencies
        run: sh scripts/ci-moon-update.sh

      - name: Build iOS shell matrix
        run: moui_shell/test_probe/tests/run-shell-matrix.sh ios --fallback-skia

      - name: Upload iOS packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moui-ios-shell-contracts
          path: artifacts/shell-ci/ios/**
          if-no-files-found: warn

  harmonyos-fallback-shells:
    name: HarmonyOS fallback shell packaging matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build zip \
            libwayland-dev libwayland-bin wayland-protocols pkg-config \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install MoonBit dependencies
        run: sh scripts/ci-moon-update.sh

      - name: Build HarmonyOS shell packaging matrix
        run: moui_shell/test_probe/tests/run-shell-matrix.sh harmonyos --fallback-skia

      - name: Upload HarmonyOS packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moui-harmonyos-shell-contracts
          path: |
            artifacts/shell-ci/harmonyos/**
          if-no-files-found: warn

  harmonyos-hvigor-plugin:
    name: HarmonyOS managed plugin Hvigor compile
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_harmonyos_hvigor }}
    runs-on: [self-hosted, harmonyos]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install MoonBit dependencies
        run: sh scripts/ci-moon-update.sh

      - name: Compile managed and plugin shells with Hvigor
        run: moui_shell/test_probe/tests/build-harmonyos-hvigor-fixture.sh

      - name: Upload HarmonyOS Hvigor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moui-harmonyos-hvigor-plugin
          path: artifacts/shell-ci/harmonyos/**
          if-no-files-found: warn
