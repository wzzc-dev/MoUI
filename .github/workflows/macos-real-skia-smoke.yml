name: macOS Real Skia Smoke

on:
  workflow_dispatch:
    inputs:
      skia_rev:
        description: Skia revision, branch, or tag to build; empty uses skia-revision.txt
        required: false
        default: ""
      skia_include:
        description: Existing Skia checkout/include root; falls back to SKIA_MBT_SKIA_INCLUDE on the runner
        required: false
        default: ""
      skia_lib_dir:
        description: Existing directory containing libskia.a or libskia.dylib; falls back to SKIA_MBT_SKIA_LIB_DIR on the runner
        required: false
        default: ""
      skia_lib:
        description: Library name without lib prefix
        required: false
        default: skia
      extra_gn_args:
        description: Extra GN args for source-built Skia
        required: false
        default: ""
      extra_cc_flags:
        description: Extra C/C++ flags for the MoonBit native stub
        required: false
        default: ""
      extra_link_flags:
        description: Extra linker flags for the smoke executable
        required: false
        default: ""
      dry_run_config:
        description: Print resolved config without building Skia or rewriting native/moon.pkg
        type: boolean
        required: false
        default: false

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect smoke mode
        id: smoke-mode
        shell: bash
        env:
          SKIA_INCLUDE_INPUT: ${{ inputs.skia_include }}
          SKIA_LIB_DIR_INPUT: ${{ inputs.skia_lib_dir }}
        run: |
          if [[ -n "$SKIA_INCLUDE_INPUT" || -n "$SKIA_LIB_DIR_INPUT" ]]; then
            if [[ -z "$SKIA_INCLUDE_INPUT" || -z "$SKIA_LIB_DIR_INPUT" ]]; then
              echo "skia_include and skia_lib_dir must be supplied together for existing-build mode" >&2
              exit 2
            fi
            echo "existing_build=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${SKIA_MBT_SKIA_INCLUDE:-}" || -n "${SKIA_MBT_SKIA_LIB_DIR:-}" ]]; then
            if [[ -z "${SKIA_MBT_SKIA_INCLUDE:-}" || -z "${SKIA_MBT_SKIA_LIB_DIR:-}" ]]; then
              echo "SKIA_MBT_SKIA_INCLUDE and SKIA_MBT_SKIA_LIB_DIR must be supplied together for existing-build mode" >&2
              exit 2
            fi
            echo "existing_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight smoke configuration
        shell: bash
        env:
          SKIA_REV: ${{ inputs.skia_rev }}
          SKIA_INCLUDE: ${{ inputs.skia_include }}
          SKIA_LIB_DIR: ${{ inputs.skia_lib_dir }}
          SKIA_LIB: ${{ inputs.skia_lib }}
          EXTRA_GN_ARGS: ${{ inputs.extra_gn_args }}
          EXTRA_CC_FLAGS: ${{ inputs.extra_cc_flags }}
          EXTRA_LINK_FLAGS: ${{ inputs.extra_link_flags }}
        run: |
          mkdir -p logs
          if [[ "${{ steps.smoke-mode.outputs.existing_build }}" == "true" ]]; then
            smoke_args=(
              --dry-run-config
              --skia-lib "$SKIA_LIB"
            )
            if [[ -n "$SKIA_INCLUDE" ]]; then
              smoke_args+=(--skia-include "$SKIA_INCLUDE")
            fi
            if [[ -n "$SKIA_LIB_DIR" ]]; then
              smoke_args+=(--skia-lib-dir "$SKIA_LIB_DIR")
            fi
            if [[ -n "$EXTRA_CC_FLAGS" ]]; then
              smoke_args+=(--extra-cc-flags "$EXTRA_CC_FLAGS")
            fi
            if [[ -n "$EXTRA_LINK_FLAGS" ]]; then
              smoke_args+=(--extra-link-flags "$EXTRA_LINK_FLAGS")
            fi
            bash scripts/macos-skia-smoke.sh "${smoke_args[@]}" 2>&1 | tee logs/macos-real-skia-smoke-preflight.log
            exit 0
          fi

          build_args=(--dry-run-config)
          if [[ -n "$SKIA_REV" ]]; then
            build_args+=(--skia-rev "$SKIA_REV")
          fi
          if [[ -n "$EXTRA_GN_ARGS" ]]; then
            build_args+=(--extra-gn-args "$EXTRA_GN_ARGS")
          fi
          set -o pipefail
          bash scripts/macos-build-skia.sh "${build_args[@]}" 2>&1 | tee logs/macos-real-skia-smoke-preflight.log

          mkdir -p .skia-dry-run/skia/include/core .skia-dry-run/lib
          touch .skia-dry-run/skia/include/core/SkSurface.h ".skia-dry-run/lib/lib$SKIA_LIB.a"
          smoke_args=(
            --dry-run-config
            --skia-include .skia-dry-run/skia
            --skia-lib-dir .skia-dry-run/lib
            --skia-lib "$SKIA_LIB"
          )
          if [[ -n "$EXTRA_CC_FLAGS" ]]; then
            smoke_args+=(--extra-cc-flags "$EXTRA_CC_FLAGS")
          fi
          if [[ -n "$EXTRA_LINK_FLAGS" ]]; then
            smoke_args+=(--extra-link-flags "$EXTRA_LINK_FLAGS")
          fi
          bash scripts/macos-skia-smoke.sh "${smoke_args[@]}" 2>&1 | tee -a logs/macos-real-skia-smoke-preflight.log

      - name: Set up MoonBit
        if: ${{ !inputs.dry_run_config }}
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        if: ${{ !inputs.dry_run_config }}
        shell: bash
        run: brew install ninja

      - name: Cache Skia checkout and build
        if: ${{ !inputs.dry_run_config && steps.smoke-mode.outputs.existing_build != 'true' }}
        uses: actions/cache@v4
        with:
          path: .skia-cache/macos
          key: skia-macos-${{ inputs.skia_rev || hashFiles('skia-revision.txt') }}-${{ hashFiles('scripts/macos-build-skia.sh', 'scripts/macos-skia-smoke.sh') }}
          restore-keys: |
            skia-macos-${{ inputs.skia_rev || hashFiles('skia-revision.txt') }}-
            skia-macos-

      - name: Build Skia for smoke test
        if: ${{ !inputs.dry_run_config && steps.smoke-mode.outputs.existing_build != 'true' }}
        shell: bash
        env:
          SKIA_REV: ${{ inputs.skia_rev }}
          EXTRA_GN_ARGS: ${{ inputs.extra_gn_args }}
        run: |
          args=()
          if [[ -n "$SKIA_REV" ]]; then
            args+=(--skia-rev "$SKIA_REV")
          fi
          if [[ -n "$EXTRA_GN_ARGS" ]]; then
            args+=(--extra-gn-args "$EXTRA_GN_ARGS")
          fi
          set -o pipefail
          bash scripts/macos-build-skia.sh "${args[@]}" 2>&1 | tee logs/macos-skia-build.log

      - name: Run native smoke test
        shell: bash
        env:
          SKIA_INCLUDE: ${{ inputs.skia_include }}
          SKIA_LIB_DIR: ${{ inputs.skia_lib_dir }}
          SKIA_LIB: ${{ inputs.skia_lib }}
          EXTRA_CC_FLAGS: ${{ inputs.extra_cc_flags }}
          EXTRA_LINK_FLAGS: ${{ inputs.extra_link_flags }}
          DRY_RUN_CONFIG: ${{ inputs.dry_run_config }}
        run: |
          mkdir -p logs
          if [[ "$DRY_RUN_CONFIG" == "true" ]]; then
            echo "dry_run_config=true; real macOS smoke was not run" | tee logs/macos-real-skia-smoke.log
            exit 0
          fi
          if [[ "${{ steps.smoke-mode.outputs.existing_build }}" == "true" ]]; then
            args=()
            if [[ -n "$SKIA_INCLUDE" ]]; then
              args+=(--skia-include "$SKIA_INCLUDE")
            fi
            if [[ -n "$SKIA_LIB_DIR" ]]; then
              args+=(--skia-lib-dir "$SKIA_LIB_DIR")
            fi
          else
            args=(
              --skia-include "$PWD/.skia-cache/macos/skia"
              --skia-lib-dir "$PWD/.skia-cache/macos/skia/out/moonbit-smoke"
            )
          fi
          args+=(--skia-lib "$SKIA_LIB")
          if [[ -n "$EXTRA_CC_FLAGS" ]]; then
            args+=(--extra-cc-flags "$EXTRA_CC_FLAGS")
          fi
          if [[ -n "$EXTRA_LINK_FLAGS" ]]; then
            args+=(--extra-link-flags "$EXTRA_LINK_FLAGS")
          fi
          bash scripts/macos-accept-real-skia-smoke.sh --log-dir logs "${args[@]}"

      - name: Verify native smoke success marker
        if: ${{ always() && !inputs.dry_run_config }}
        shell: bash
        run: bash scripts/verify-native-smoke-log.sh logs/macos-native-smoke-output.log

      - name: Verify acceptance summary
        if: ${{ always() && !inputs.dry_run_config }}
        shell: bash
        run: bash scripts/verify-acceptance-log.sh logs/macos-real-skia-acceptance.log

      - name: Verify real Skia artifact bundle
        if: ${{ always() && !inputs.dry_run_config }}
        shell: bash
        run: bash scripts/verify-real-skia-artifact.sh --platform macos --log-dir logs

      - name: Verify pinned Skia revision match
        if: ${{ always() && !inputs.dry_run_config }}
        shell: bash
        run: bash scripts/verify-skia-revision-pin.sh logs/macos-real-skia-acceptance.log --skip-if-unpinned

      - name: Upload smoke log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-real-skia-smoke-log
          path: |
            logs/macos-real-skia-smoke-preflight.log
            logs/macos-skia-build.log
            logs/macos-real-skia-smoke.log
            logs/macos-native-smoke-output.log
            logs/macos-real-skia-acceptance.log
          if-no-files-found: warn

      - name: Verify native package restored
        if: ${{ always() }}
        shell: bash
        run: |
          restore_status="${restore_status:-passed}"
          if [[ -f native/moon.pkg.smoke.bak ]]; then
            echo "native/moon.pkg smoke backup is still present" >&2
            restore_status="failed"
          fi
          if ! git diff --exit-code -- native/moon.pkg; then
            echo "native/moon.pkg differs after macOS Skia smoke" >&2
            restore_status="failed"
          fi
          echo "restore_status=$restore_status" >> "$GITHUB_ENV"
          if [[ "$restore_status" != "passed" ]]; then
            exit 1
          fi

      - name: Write workflow summary
        if: ${{ always() }}
        shell: bash
        env:
          SKIA_REV: ${{ inputs.skia_rev }}
          SKIA_INCLUDE: ${{ inputs.skia_include }}
          SKIA_LIB_DIR: ${{ inputs.skia_lib_dir }}
          SKIA_LIB: ${{ inputs.skia_lib }}
          EXTRA_GN_ARGS: ${{ inputs.extra_gn_args }}
          EXTRA_CC_FLAGS: ${{ inputs.extra_cc_flags }}
          EXTRA_LINK_FLAGS: ${{ inputs.extra_link_flags }}
          DRY_RUN_CONFIG: ${{ inputs.dry_run_config }}
        run: |
          resolved_commit="not run"
          if [[ -n "${macos_skia_commit:-}" ]]; then
            resolved_commit="$macos_skia_commit"
          elif [[ -f logs/macos-real-skia-smoke.log ]]; then
            resolved_commit="$(grep -E '^[[:space:]]*skia_commit=' logs/macos-real-skia-smoke.log | tail -n 1 | sed 's/^[[:space:]]*skia_commit=//' || true)"
          fi
          {
            echo "## macOS Real Skia Smoke"
            echo ""
            echo "- Dry run only: ${DRY_RUN_CONFIG:-false}"
            if [[ -n "$SKIA_INCLUDE" || -n "$SKIA_LIB_DIR" ]]; then
              echo "- Mode: existing Skia build"
            else
              echo "- Mode: source-built Skia"
            fi
            echo "- Skia revision: ${SKIA_REV:-<skia-revision.txt>}"
            echo "- Resolved Skia commit: ${resolved_commit:-not run}"
            echo "- Skia include: ${SKIA_INCLUDE:-<source build>}"
            echo "- Skia lib dir: ${SKIA_LIB_DIR:-<source build>}"
            echo "- Skia library: ${SKIA_LIB:-skia}"
            echo "- Extra GN args: ${EXTRA_GN_ARGS:-<none>}"
            echo "- Extra C/C++ flags: ${EXTRA_CC_FLAGS:-<none>}"
            echo "- Extra link flags: ${EXTRA_LINK_FLAGS:-<none>}"
            echo "- Artifact: macos-real-skia-smoke-log"
            echo "- Preflight log: logs/macos-real-skia-smoke-preflight.log"
            echo "- Build log: logs/macos-skia-build.log"
            echo "- Smoke log: logs/macos-real-skia-smoke.log"
            echo "- Native smoke executable log: logs/macos-native-smoke-output.log"
            echo "- Acceptance log: logs/macos-real-skia-acceptance.log"
            echo "- Native smoke success marker: ${native_smoke_marker_status:-not run}"
            echo "- native/moon.pkg restore check: ${restore_status:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"
