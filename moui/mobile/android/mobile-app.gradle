import groovy.json.JsonSlurper

def appId = (project.findProperty("mouiApp") ?: project.ext.mouiDefaultApp).toString()
def workspaceRoot = file(project.findProperty("mouiWorkspaceRoot") ?: "${rootProject.projectDir}/../../..")
def mouiRoot = file(project.findProperty("mouiRoot") ?: "${workspaceRoot}/moui")
def defaultSkiaRoot = [
    "${workspaceRoot}/moui_skia",
    "${mouiRoot.parentFile}/moui_skia",
    "${workspaceRoot}/.mooncakes/wzzc-dev/moui_skia",
].find { file(it).isDirectory() } ?: "${workspaceRoot}/moui_skia"
def skiaRoot = file(project.findProperty("mouiSkiaRoot") ?: defaultSkiaRoot)
def androidShell = (project.findProperty("mouiAndroidShell") ?: "managed").toString()
if (!(androidShell in ["managed", "ejected", "legacy"])) {
    throw new GradleException("mouiAndroidShell must be managed, ejected, or legacy, got ${androidShell}")
}
def managedAndroidShell = androidShell == "managed"
def ejectedAndroidShell = androidShell == "ejected"
def modernAndroidShell = managedAndroidShell || ejectedAndroidShell
def generatedRoot = file(project.findProperty("mouiBuildDir") ?: "${workspaceRoot}/artifacts/android/${appId}")
def defaultMetadataFile = file("${workspaceRoot}/examples/${appId}/mobile.json")
if (!defaultMetadataFile.isFile()) {
    defaultMetadataFile = file("${workspaceRoot}/mobile.json")
}
def metadataFile = file(project.findProperty("mouiAppConfig") ?: defaultMetadataFile)
def contractsFile = file(project.findProperty("mouiContracts") ?: "${mouiRoot}/mobile/build-contracts.json")

def mergePlatformConfig = { builtInConfig, appPlatformConfig ->
    def merged = [:]
    if (builtInConfig instanceof Map) {
        merged.putAll(builtInConfig)
    }
    [appPlatformConfig.native ?: [:], appPlatformConfig.build ?: [:]].each { source ->
        source.each { key, value ->
            if (key == "exports" && value instanceof Map) {
                def exports = [:]
                if (merged.exports instanceof Map) {
                    exports.putAll(merged.exports)
                }
                exports.putAll(value)
                merged.exports = exports
            } else {
                merged[key] = value
            }
        }
    }
    appPlatformConfig.each { key, value ->
        if (key != "native" && key != "build") {
            merged[key] = value
        }
    }
    return merged
}

def androidConfig = [:]
def displayName = ""
def minSdkVersion = 0
def legacySupportsScroll = false
def androidManagedManifest = null
def androidAppResources = []

if (modernAndroidShell) {
    def generatedShellRoot = file("${generatedRoot}/android/${androidShell}-shell").canonicalFile
    def generatedShellConfigFile = file("${generatedShellRoot}/shell-config.json")
    if (!generatedShellConfigFile.isFile()) {
        throw new GradleException(
            "MoUI ${androidShell} Android shell config was not prepared: ${generatedShellConfigFile}; " +
                "run moui/scripts/mobile/prepare-native-build.mjs before Gradle",
        )
    }
    def managedShellConfig = new JsonSlurper().parse(generatedShellConfigFile)
    if (managedShellConfig.schemaVersion != 1 || managedShellConfig.platform != "android" ||
        managedShellConfig.app != appId || managedShellConfig.shellMode != androidShell ||
        managedShellConfig.shellApiVersion != 1 || managedShellConfig.runtimeAbiVersion != 1) {
        throw new GradleException("Invalid generated MoUI ${androidShell} Android shell config: ${generatedShellConfigFile}")
    }
    if (project.hasProperty("mouiMinSdk")) {
        throw new GradleException("mouiMinSdk is only supported by the explicit legacy Android shell")
    }
    if (!(managedShellConfig.minSdk instanceof Number) || managedShellConfig.minSdk.intValue() < 23) {
        throw new GradleException("Generated MoUI managed Android minSdk must be at least 23")
    }
    def generatedPath = { value, label ->
        def path = file(value).canonicalFile
        def prefix = generatedShellRoot.path + File.separator
        if (path.path != generatedShellRoot.path && !path.path.startsWith(prefix)) {
            throw new GradleException("Generated MoUI Android ${label} escapes ${generatedShellRoot}: ${path}")
        }
        return path
    }
    if (managedAndroidShell) {
        androidManagedManifest = generatedPath(managedShellConfig.manifestPath, "manifest")
        if (!androidManagedManifest.isFile()) {
            throw new GradleException("Generated MoUI managed Android manifest was not found: ${androidManagedManifest}")
        }
        androidAppResources = (managedShellConfig.resourceDirs ?: []).collect { value ->
            def path = generatedPath(value, "resource directory")
            if (!path.isDirectory()) {
                throw new GradleException("Generated MoUI Android resource directory was not found: ${path}")
            }
            return path
        }
    } else if (managedShellConfig.manifestPath != null || !(managedShellConfig.resourceDirs ?: []).isEmpty()) {
        throw new GradleException("Generated ejected Android config must not claim project-owned manifest or resources")
    }
    androidConfig = [
        applicationId: managedShellConfig.applicationId,
        nativeLibrary: managedShellConfig.nativeLibrary,
        fullscreen: managedShellConfig.systemUi?.fullscreen,
    ]
    displayName = managedShellConfig.displayName
    minSdkVersion = managedShellConfig.minSdk.intValue()
} else {
    if (!metadataFile.isFile()) {
        throw new GradleException("MoUI legacy mobile app metadata not found: ${metadataFile}")
    }
    def appConfig = new JsonSlurper().parse(metadataFile)
    if (appConfig == null || appConfig.schemaVersion != 1 || appConfig.android == null || appConfig.mobile == null) {
        throw new GradleException("Legacy MoUI Android app ${appId} requires schemaVersion 1 metadata")
    }
    def contracts = contractsFile.isFile() ? new JsonSlurper().parse(contractsFile).apps : [:]
    def contractConfig = contracts[appId] ?: [:]
    androidConfig = mergePlatformConfig(contractConfig.android ?: [:], appConfig.android)
    androidConfig.fullscreen = appConfig.mobile.fullscreen
    displayName = appConfig.displayName
    minSdkVersion = (project.findProperty("mouiMinSdk") ?: "23").toString().toInteger()
    def legacyScrollExport = androidConfig.exports instanceof Map
        ? androidConfig.exports.dispatchScroll
        : null
    legacySupportsScroll = legacyScrollExport instanceof String && !legacyScrollExport.trim().isEmpty()
    ["applicationId", "nativeLibrary", "moonPackage", "generatedC", "appArg", "moonbitMainAlias"].each { key ->
        if (!androidConfig[key]) {
            throw new GradleException("MoUI legacy Android app ${appId} is missing ${key} in ${metadataFile} or ${contractsFile}")
        }
    }
    ["attachSurface", "resize", "dispatchPointer", "frameTick", "renderFrame", "detachSurface"].each { key ->
        if (!(androidConfig.exports instanceof Map) || !androidConfig.exports[key]) {
            throw new GradleException("MoUI legacy Android app ${appId} is missing exports.${key} in ${metadataFile} or ${contractsFile}")
        }
    }
    if (legacySupportsScroll && !androidConfig.exports.dispatchScroll) {
        throw new GradleException("MoUI legacy Android app ${appId} supports scroll but is missing exports.dispatchScroll")
    }
}

["applicationId", "nativeLibrary"].each { key ->
    if (!androidConfig[key]) {
        throw new GradleException("MoUI Android app ${appId} is missing generated ${key}")
    }
}
if (!(androidConfig.fullscreen instanceof Boolean) || !displayName) {
    throw new GradleException("MoUI Android app ${appId} has invalid generated identity or system UI config")
}
def abi = (project.findProperty("mouiAbi") ?: "arm64-v8a").toString()
def compileSdkVersion = (project.findProperty("mouiCompileSdk") ?: "36").toString().toInteger()
def targetSdkVersion = (project.findProperty("mouiTargetSdk") ?: "35").toString().toInteger()
def fallbackSkia = (project.findProperty("mouiFallbackSkia") ?: "false").toString().toBoolean()
def renderer = (project.findProperty("mouiRenderer") ?: "auto").toString()
def androidShellSourceRoot = modernAndroidShell
    ? file("${mouiRoot}/mobile/android/src/main/kotlin")
    : file("${mouiRoot}/mobile/legacy/android/src/main/java")
def androidGlueRoot = modernAndroidShell
    ? file("${mouiRoot}/mobile/android")
    : file("${mouiRoot}/mobile/legacy/android")
def androidManagedShellCmake = modernAndroidShell ? "ON" : "OFF"
def androidActivityClass = modernAndroidShell
    ? "dev.wzzc.moui.mobile.MoUIActivity"
    : "dev.wzzc.moui.mobile.MobileActivity"
def androidClipboardProviderClass = modernAndroidShell
    ? "dev.wzzc.moui.mobile.MoUIClipboardProvider"
    : "dev.wzzc.moui.mobile.MobileClipboardProvider"
def androidPluginRoot = file("${generatedRoot}/android/plugins")
def androidPluginGeneratedKotlin = file("${androidPluginRoot}/generated/kotlin")
def androidPluginKotlin = file("${androidPluginRoot}/sources/kotlin")
def androidPluginJava = file("${androidPluginRoot}/sources/java")
def androidPluginResources = file("${androidPluginRoot}/res")

def prepareMouiMobileNative = tasks.register("prepareMouiMobileNative", Exec) {
    workingDir workspaceRoot
    commandLine "node",
        "${mouiRoot}/scripts/mobile/prepare-native-build.mjs",
        "--platform", "android",
        "--app", appId,
        "--workspace-root", workspaceRoot.absolutePath,
        "--moui-root", mouiRoot.absolutePath,
        "--skia-root", skiaRoot.absolutePath,
        "--app-config", metadataFile.absolutePath,
        "--contracts", contractsFile.absolutePath,
        "--abi", abi,
        "--android-shell", androidShell,
        "--renderer", renderer,
        "--build-dir", generatedRoot.absolutePath
    if (fallbackSkia) {
        args "--fallback-skia"
    }
}

// Pin one complete NDK for CMake, jniLibs libc++, and packaging. Mixed NDK
// 25/28 libc++ was shipping a minimal stripped libc++ without
// std::ostringstream vtable → UnsatisfiedLinkError at dlopen.
def pinnedNdkVersion = (project.findProperty("mouiNdkVersion")
    ?: System.getenv("MOUI_ANDROID_NDK_VERSION")
    ?: "28.2.13676358").toString()

android {
    namespace = androidConfig.applicationId
    compileSdk = compileSdkVersion
    ndkVersion = pinnedNdkVersion

    defaultConfig {
        applicationId = androidConfig.applicationId
        minSdk = minSdkVersion
        targetSdk = targetSdkVersion
        versionCode = 1
        versionName = "0.1.0"

        manifestPlaceholders = [
            mouiAppLabel: displayName,
            mouiActivityClass: androidActivityClass,
            mouiClipboardProviderClass: androidClipboardProviderClass,
            mouiNativeLibrary: androidConfig.nativeLibrary,
            mouiSupportsScroll: (modernAndroidShell || legacySupportsScroll).toString(),
            mouiFullscreen: androidConfig.fullscreen.toString(),
        ]

        externalNativeBuild {
            cmake {
                // Match Skia prebuilts and jniLibs: full shared libc++ from the same NDK.
                arguments(
                    "-DMOUI_ROOT=${mouiRoot.absolutePath}",
                    "-DMOUI_MOBILE_NATIVE_CONFIG=${generatedRoot.absolutePath}/native/moui-mobile-native.cmake",
                    "-DMOUI_MOBILE_ANDROID_GLUE_ROOT=${androidGlueRoot.absolutePath}",
                    "-DMOUI_MOBILE_ANDROID_MANAGED_SHELL=${androidManagedShellCmake}",
                    "-DANDROID_STL=c++_shared",
                )
            }
        }

        ndk {
            abiFilters += abi
        }
    }

    sourceSets {
        main {
            if (managedAndroidShell) {
                manifest.srcFile androidManagedManifest
                kotlin.srcDirs += [
                    androidShellSourceRoot,
                    androidPluginGeneratedKotlin,
                    androidPluginKotlin,
                ]
                java.srcDirs += [androidPluginJava]
                res.srcDirs += androidAppResources
                res.srcDirs += [androidPluginResources]
            } else if (ejectedAndroidShell) {
                kotlin.srcDirs += [
                    androidPluginGeneratedKotlin,
                    androidPluginKotlin,
                ]
                java.srcDirs += [androidPluginJava]
                res.srcDirs += [androidPluginResources]
            } else {
                java.srcDirs += [androidShellSourceRoot]
            }
            jniLibs.srcDirs += ["${generatedRoot}/jniLibs"]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Prefer the full NDK libc++ we stage under jniLibs over any
            // stripped/minimal merge input. AGP strip must not drop STL symbols
            // (missing ostringstream vtable → UnsatisfiedLinkError).
            pickFirsts += ["**/libc++_shared.so"]
            keepDebugSymbols += ["**/libc++_shared.so"]
        }
    }

    // AGP 8+/9 packaging: do not strip libc++_shared.so at all.
    packagingOptions {
        doNotStrip "*/arm64-v8a/libc++_shared.so"
        doNotStrip "*/armeabi-v7a/libc++_shared.so"
        doNotStrip "*/x86_64/libc++_shared.so"
        doNotStrip "*/x86/libc++_shared.so"
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }
}

dependencies {
    if (modernAndroidShell) {
        implementation "androidx.activity:activity:1.13.0"
    }
}

tasks.configureEach { task ->
    if (task.name == "preBuild" || task.name.startsWith("configureCMake") || task.name.startsWith("externalNativeBuild")) {
        task.dependsOn prepareMouiMobileNative
    }
}
