name: MoUI iOS Shell Runtime Evidence

on:
  schedule:
    - cron: "17 7 * * 3"
  workflow_dispatch:
    inputs:
      app:
        description: Shell app id to smoke
        required: false
        default: showcase
        type: choice
        options:
          - showcase
          - counter
      renderer:
        description: Skia renderer selection
        required: false
        default: auto
        type: choice
        options:
          - auto
          - skia-gpu
          - skia-raster

jobs:
  ios-shell-runtime-evidence:
    name: iOS MoUI Showcase runtime smoke
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Update MoonBit registry
        shell: bash
        run: scripts/ci-moon-update.sh

      - name: Install idb
        shell: bash
        run: |
          if ! command -v idb >/dev/null 2>&1; then
            python3 -m pip install --user fb-idb
            echo "$HOME/Library/Python/3.*/bin" >> "$GITHUB_PATH" || true
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          if ! command -v idb_companion >/dev/null 2>&1; then
            brew install idb-companion || true
          fi
          command -v idb
          command -v idb_companion || true

      - name: Run iOS shell runtime evidence
        shell: bash
        env:
          MOUI_EMBEDDING_APP: ${{ inputs.app || 'showcase' }}
          MOUI_SKIA_RENDERER: ${{ inputs.renderer || 'auto' }}
        run: |
          chmod +x scripts/ios-shell-runtime-evidence.sh
          scripts/ios-shell-runtime-evidence.sh

      - name: Upload iOS shell runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moui-ios-shell-runtime-evidence
          path: |
            artifacts/shell-runtime/ios/**
            artifacts/ios/**
          if-no-files-found: warn
