<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoUI Multi-Window Wasm GC</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; background: #f6f7f9; }
      #canvas-host {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 16px;
        min-height: 100vh;
        padding: 16px;
      }
      canvas {
        display: block;
        min-width: 0;
        min-height: 320px;
        width: 100%;
        height: 100%;
        outline: none;
        border: 1px solid rgba(0, 0, 0, 0.16);
        border-radius: 10px;
        background: white;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="canvas-host" aria-label="MoUI multi-canvas host"></div>
    <script type="module">
      import { bootMouiWasmGcApp } from "../../../moui_web_renderer/runtime.js";

      bootMouiWasmGcApp({
        wasmUrl: new URL(
          "../../../_build/wasm-gc/debug/build/examples/multi_window/web_wasm/web_wasm.wasm",
          import.meta.url,
        ),
        canvasHost: "#canvas-host",
      }).catch(error => console.error(error));
    </script>
  </body>
</html>
