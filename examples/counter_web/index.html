<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoUI Counter WebGPU</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f5f7fb;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #moui-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #status {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #172033;
        background: #f5f7fb;
        font: 500 15px/1.5 system-ui, sans-serif;
        text-align: center;
      }

      #status.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="moui-canvas"></canvas>
    </div>
    <div id="status"></div>
    <script src="./counter_web.js"></script>
    <script type="module" src="./bootstrap.js"></script>
  </body>
</html>
