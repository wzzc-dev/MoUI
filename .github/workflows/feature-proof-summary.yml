name: MoUI Feature Proof Summary

on:
  workflow_run:
    workflows: ["MoUI CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Specific ci.yml run_id to summarize. Defaults to latest.
        required: false
        default: ""

jobs:
  summarize:
    name: Feature proof summary
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Collect CI workflow statuses
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Determine which ci.yml run to summarize
            let runId;
            if (context.eventName === 'workflow_dispatch' && '${{ inputs.ci_run_id }}' !== '') {
              runId = parseInt('${{ inputs.ci_run_id }}');
            } else if (context.payload.workflow_run) {
              runId = context.payload.workflow_run.id;
            } else {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci.yml',
                per_page: 1,
              });
              if (runs.data.workflow_runs.length === 0) {
                core.setFailed('No ci.yml runs found');
                return;
              }
              runId = runs.data.workflow_runs[0].id;
            }

            // Collect ci.yml job statuses
            const ciJobs = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: runId,
            });
            const status = {};
            // Map display names to short keys used by generate-feature-proof-report.mjs
            const jobNameToKey = {
              "Core conformance": "conformance",
              "Public API surface": "api-surface",
              "Linux platform contracts": "linux-platform",
              "macOS packaging smoke": "macos-packaging",
              "Benchmark scaffold": "benchmark-scaffold",
              "Windows MSVC native smoke": "windows-native",
              "macOS real-Skia smoke": "macos-real-skia",
              "Linux real-Skia smoke": "linux-real-skia",
              "Windows real-Skia smoke": "windows-real-skia",
            };
            for (const job of ciJobs.data.jobs) {
              const key = jobNameToKey[job.name] ?? job.name;
              status[key] = job.conclusion;
            }

            const run = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: runId,
            });
            const headSha = run.data.head_sha;

            // Collect moui-skia-real-skia-pr-smoke.yml job statuses for the same SHA
            try {
              const skiaRuns = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'moui-skia-real-skia-pr-smoke.yml',
                per_page: 10,
              });
              // Find the run that matches our head SHA (Skia smoke only runs on PRs,
              // so it won't exist for push-to-main — that's expected)
              const matchingSkiaRun = skiaRuns.data.workflow_runs.find(
                r => r.head_sha === headSha
              );
              if (matchingSkiaRun) {
                const skiaJobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner,
                  repo,
                  run_id: matchingSkiaRun.id,
                });
                for (const job of skiaJobs.data.jobs) {
                  const key = jobNameToKey[job.name] ?? job.name;
                  status[key] = job.conclusion;
                }
              }
            } catch (e) {
              // Skia smoke workflow may not have runs yet
            }

            core.setOutput('status', JSON.stringify(status));
            core.setOutput('run_id', String(runId));
            core.setOutput('html_url', run.data.html_url);

      - name: Generate feature proof report
        env:
          JOB_STATUS: ${{ steps.collect.outputs.status }}
          RUN_URL: ${{ steps.collect.outputs.html_url }}
        run: |
          mkdir -p artifacts/feature-proof
          node scripts/generate-feature-proof-report.mjs \
            --status "$JOB_STATUS" \
            --run-url "$RUN_URL" \
            --output artifacts/feature-proof/proof-report.json

      - name: Verify feature proof coverage
        run: |
          node scripts/verify-feature-proof-coverage.mjs \
            --report artifacts/feature-proof/proof-report.json

      - name: Upload feature proof summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-proof-summary
          path: artifacts/feature-proof/
          if-no-files-found: warn

      - name: Write summary
        if: ${{ always() }}
        run: |
          echo "## Feature Proof Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat artifacts/feature-proof/proof-report.md >> $GITHUB_STEP_SUMMARY
