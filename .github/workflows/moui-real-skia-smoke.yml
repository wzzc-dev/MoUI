name: MoUI Real Skia Smoke

on:
  workflow_dispatch:
    inputs:
      run_showcase_smoke:
        description: Run the macOS Skia Showcase first-frame smoke.
        required: false
        default: false
        type: boolean
      run_markdown_smoke:
        description: Run the macOS Skia Markdown Editor first-frame smoke.
        required: false
        default: false
        type: boolean

env:
  MOUI_WINDOW_REMOTE: https://github.com/wzzc-dev/window.git

jobs:
  macos-real-skia-smoke:
    name: macOS real Skia smoke
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Restore local dependencies
        run: sh scripts/setup-local-deps.sh

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Run macOS real Skia smoke
        run: |
          mkdir -p artifacts/platform-evidence/macos
          args=(
            --smoke-log artifacts/platform-evidence/macos/skia-renderer-smoke.log
          )
          if [[ "${{ inputs.run_showcase_smoke }}" == "true" || "${{ inputs.run_markdown_smoke }}" == "true" ]]; then
            args+=(
              --run-showcase-smoke
              --showcase-log artifacts/platform-evidence/macos/showcase-macos-skia-first-frame.log
            )
          fi
          if [[ "${{ inputs.run_markdown_smoke }}" == "true" ]]; then
            args+=(
              --run-markdown-smoke
              --markdown-log artifacts/platform-evidence/macos/markdown-macos-skia-first-frame.log
            )
          fi
          sh scripts/macos-skia-renderer-smoke.sh "${args[@]}"

      - name: Upload macOS real Skia smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: moui-macos-real-skia-smoke
          path: artifacts/platform-evidence/macos/
          if-no-files-found: warn
