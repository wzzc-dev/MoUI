name: MoUI HarmonyOS Shell Runtime Evidence

on:
  workflow_dispatch:
    inputs:
      app:
        description: Shell app id to smoke
        required: false
        default: showcase
        type: choice
        options:
          - showcase
          - harmonyos_demo
      renderer:
        description: Skia renderer selection
        required: false
        default: auto
        type: choice
        options:
          - auto
          - skia-gpu
          - skia-raster
      device:
        description: Optional hdc target override
        required: false
        default: ""
        type: string

jobs:
  harmonyos-shell-runtime-evidence:
    name: HarmonyOS MoUI Showcase runtime smoke
    # Self-hosted only: DevEco SDK, hdc, and a signed commercial/HVD host.
    runs-on: [self-hosted, harmonyos]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Update MoonBit registry
        shell: bash
        run: scripts/ci-moon-update.sh

      - name: Preflight signing material
        shell: bash
        run: |
          if [ -z "${MOUI_HARMONYOS_SIGNING_CONFIG:-}" ] && [ -z "${MOUI_HARMONYOS_SIGNING_CONFIG_FILE:-}" ]; then
            echo "Self-hosted runner must provide MOUI_HARMONYOS_SIGNING_CONFIG(_FILE) for commercial devices." >&2
            exit 2
          fi

      - name: Run HarmonyOS shell runtime evidence
        shell: bash
        env:
          MOUI_EMBEDDING_APP: ${{ inputs.app || 'showcase' }}
          MOUI_SKIA_RENDERER: ${{ inputs.renderer || 'auto' }}
          MOUI_HARMONYOS_DEVICE: ${{ inputs.device }}
        run: |
          chmod +x scripts/harmonyos-shell-runtime-evidence.sh
          scripts/harmonyos-shell-runtime-evidence.sh

      - name: Upload HarmonyOS shell runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moui-harmonyos-shell-runtime-evidence
          path: |
            artifacts/shell-runtime/harmonyos/**
            artifacts/harmonyos/**
          if-no-files-found: warn
