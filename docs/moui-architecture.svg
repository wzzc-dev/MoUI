<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="appGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="viewsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="runtimeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="renderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="nativeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1100" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="500" y="52" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="700" letter-spacing="3">MoUI Architecture</text>
  <text x="500" y="74" text-anchor="middle" fill="#64748b" font-size="13" letter-spacing="1.5">Multi-Platform MoonBit GUI Framework</text>
  <line x1="200" y1="86" x2="800" y2="86" stroke="#1e293b" stroke-width="1"/>

  <!-- ==================== LAYER 1: Application ==================== -->
  <g transform="translate(0, 100)">
    <text x="30" y="16" fill="#60a5fa" font-size="10" font-weight="600" letter-spacing="2">01 — APPLICATION</text>

    <!-- App Logic -->
    <rect x="180" y="28" width="280" height="56" rx="10" fill="url(#appGrad)" filter="url(#shadow)" opacity="0.95"/>
    <text x="320" y="50" text-anchor="middle" fill="white" font-size="13" font-weight="600">examples/&lt;app&gt;/app</text>
    <text x="320" y="68" text-anchor="middle" fill="#bfdbfe" font-size="10">Platform-Neutral TEA Logic</text>

    <!-- Thin Entrypoints -->
    <rect x="540" y="28" width="280" height="56" rx="10" fill="url(#appGrad)" filter="url(#shadow)" opacity="0.8"/>
    <text x="680" y="50" text-anchor="middle" fill="white" font-size="13" font-weight="600">examples/&lt;app&gt;/*_skia</text>
    <text x="680" y="68" text-anchor="middle" fill="#bfdbfe" font-size="10">Thin Platform Entrypoints</text>

    <!-- Arrow from app to entrypoints -->
    <line x1="460" y1="56" x2="538" y2="56" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

    <!-- Down arrow from Layer 1 -->
    <line x1="500" y1="84" x2="500" y2="108" stroke="#60a5fa" stroke-width="1.2" opacity="0.4" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- ==================== LAYER 2: Public API ==================== -->
  <g transform="translate(0, 210)">
    <text x="30" y="16" fill="#34d399" font-size="10" font-weight="600" letter-spacing="2">02 — PUBLIC API</text>

    <!-- moui/views -->
    <rect x="120" y="28" width="200" height="52" rx="10" fill="url(#viewsGrad)" filter="url(#shadow)" opacity="0.95"/>
    <text x="220" y="50" text-anchor="middle" fill="white" font-size="13" font-weight="600">moui/views</text>
    <text x="220" y="66" text-anchor="middle" fill="#a7f3d0" font-size="9.5">Controls, Styles, Layout</text>

    <!-- moui/services -->
    <rect x="340" y="28" width="160" height="52" rx="10" fill="url(#viewsGrad)" filter="url(#shadow)" opacity="0.85"/>
    <text x="420" y="50" text-anchor="middle" fill="white" font-size="13" font-weight="600">moui/services</text>
    <text x="420" y="66" text-anchor="middle" fill="#a7f3d0" font-size="9.5">App Services, Tasks</text>

    <!-- Domain Facades -->
    <rect x="520" y="28" width="280" height="52" rx="10" fill="url(#viewsGrad)" filter="url(#shadow)" opacity="0.75"/>
    <text x="660" y="47" text-anchor="middle" fill="white" font-size="12" font-weight="600">Domain Facades</text>
    <text x="660" y="62" text-anchor="middle" fill="#a7f3d0" font-size="9">geometry · graphics · animation · text · state</text>

    <!-- Down arrow -->
    <line x1="500" y1="80" x2="500" y2="108" stroke="#34d399" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- ==================== LAYER 3: Core ==================== -->
  <g transform="translate(0, 320)">
    <text x="30" y="16" fill="#fbbf24" font-size="10" font-weight="600" letter-spacing="2">03 — CORE CONTRACTS</text>

    <!-- moui/core -->
    <rect x="200" y="26" width="600" height="62" rx="12" fill="url(#coreGrad)" filter="url(#shadow)" opacity="0.95"/>
    <text x="500" y="50" text-anchor="middle" fill="white" font-size="15" font-weight="700">moui/core</text>
    <text x="500" y="68" text-anchor="middle" fill="#fef3c7" font-size="10.5">View · Program · Effect · Subscription · ViewNode · DrawCommand · Semantics · Theme</text>

    <!-- Down arrow -->
    <line x1="500" y1="88" x2="500" y2="116" stroke="#fbbf24" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- ==================== LAYER 4: Runtime ==================== -->
  <g transform="translate(0, 430)">
    <text x="30" y="16" fill="#f87171" font-size="10" font-weight="600" letter-spacing="2">04 — RUNTIME</text>

    <!-- moui/runtime -->
    <rect x="200" y="26" width="600" height="80" rx="12" fill="url(#runtimeGrad)" filter="url(#shadow)" opacity="0.95"/>
    <text x="500" y="50" text-anchor="middle" fill="white" font-size="15" font-weight="700">moui/runtime</text>
    <text x="500" y="68" text-anchor="middle" fill="#fecaca" font-size="10">ElementTree · LayoutTree · RenderTree · SemanticsTree · PlatformTree</text>
    <text x="500" y="84" text-anchor="middle" fill="#fecaca" font-size="10">HostRuntimeDriver · RedrawScheduler · Effects · Dispatch · Focus</text>

    <!-- Pipeline flow label -->
    <g transform="translate(830, 32)" opacity="0.6">
      <text x="0" y="0" fill="#f87171" font-size="8" font-weight="500">Pipeline:</text>
      <text x="0" y="14" fill="#94a3b8" font-size="8">View → Element</text>
      <text x="0" y="26" fill="#94a3b8" font-size="8">  → Layout → Paint</text>
      <text x="0" y="38" fill="#94a3b8" font-size="8">  → DrawCommand</text>
      <text x="0" y="50" fill="#94a3b8" font-size="8">  → Renderer</text>
    </g>

    <!-- Down arrow -->
    <line x1="500" y1="106" x2="500" y2="126" stroke="#f87171" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- ==================== LAYER 5: Backend ==================== -->
  <g transform="translate(0, 555)">
    <text x="30" y="16" fill="#c084fc" font-size="10" font-weight="600" letter-spacing="2">05 — BACKEND</text>

    <!-- moui/backend (host contracts) -->
    <rect x="180" y="28" width="280" height="46" rx="8" fill="url(#backendGrad)" filter="url(#shadow)" opacity="0.9"/>
    <text x="320" y="56" text-anchor="middle" fill="white" font-size="12" font-weight="600">moui/backend — Host Contracts</text>

    <!-- moui/backend/common -->
    <rect x="500" y="28" width="300" height="46" rx="8" fill="url(#backendGrad)" filter="url(#shadow)" opacity="0.8"/>
    <text x="650" y="56" text-anchor="middle" fill="white" font-size="12" font-weight="600">moui/backend/common — Lifecycle Bridge</text>

    <!-- Platform backends row -->
    <g transform="translate(0, 90)">
      <!-- Native Host Backends -->
      <rect x="80" y="0" width="180" height="36" rx="6" fill="#7c3aed" opacity="0.5"/>
      <text x="170" y="22" text-anchor="middle" fill="#e9d5ff" font-size="10.5" font-weight="500">macOS · Windows · Linux</text>

      <!-- Embedded Runtime Backends -->
      <rect x="280" y="0" width="220" height="36" rx="6" fill="#7c3aed" opacity="0.4"/>
      <text x="390" y="22" text-anchor="middle" fill="#e9d5ff" font-size="10.5" font-weight="500">Android · iOS · HarmonyOS</text>

      <!-- Web -->
      <rect x="520" y="0" width="100" height="36" rx="6" fill="#7c3aed" opacity="0.45"/>
      <text x="570" y="22" text-anchor="middle" fill="#e9d5ff" font-size="10.5" font-weight="500">Web</text>

      <!-- WeChat -->
      <rect x="640" y="0" width="120" height="36" rx="6" fill="#7c3aed" opacity="0.35"/>
      <text x="700" y="22" text-anchor="middle" fill="#e9d5ff" font-size="10.5" font-weight="500">WeChat</text>

      <!-- Shared backend implementation -->
      <rect x="780" y="0" width="160" height="36" rx="6" fill="#5b21b6" opacity="0.35"/>
      <text x="860" y="22" text-anchor="middle" fill="#c4b5fd" font-size="9.5" font-weight="500">backend/common</text>
    </g>

    <!-- Down arrow -->
    <line x1="500" y1="138" x2="500" y2="156" stroke="#c084fc" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- ==================== LAYER 6: Renderer ==================== -->
  <g transform="translate(0, 708)">
    <text x="30" y="16" fill="#fb7185" font-size="10" font-weight="600" letter-spacing="2">06 — RENDERER</text>

    <!-- moui/render facade -->
    <rect x="280" y="28" width="220" height="46" rx="8" fill="url(#renderGrad)" filter="url(#shadow)" opacity="0.9"/>
    <text x="390" y="56" text-anchor="middle" fill="white" font-size="12" font-weight="600">moui/render — Facade</text>

    <!-- Renderer Providers -->
    <g transform="translate(0, 88)">
      <!-- Skia (Mainline) -->
      <rect x="80" y="0" width="160" height="48" rx="8" fill="#e11d48" opacity="0.7"/>
      <text x="160" y="22" text-anchor="middle" fill="white" font-size="11" font-weight="600">render/skia</text>
      <text x="160" y="38" text-anchor="middle" fill="#fecdd3" font-size="9">★ Mainline</text>

      <!-- Canvas2D -->
      <rect x="260" y="0" width="140" height="48" rx="8" fill="#e11d48" opacity="0.4"/>
      <text x="330" y="22" text-anchor="middle" fill="white" font-size="11" font-weight="500">render/canvas2d</text>
      <text x="330" y="38" text-anchor="middle" fill="#fecdd3" font-size="9">Web fallback</text>

      <!-- WebGPU Adapter -->
      <rect x="420" y="0" width="160" height="48" rx="8" fill="#e11d48" opacity="0.4"/>
      <text x="500" y="22" text-anchor="middle" fill="white" font-size="11" font-weight="500">render/webgpu_adapter</text>
      <text x="500" y="38" text-anchor="middle" fill="#fecdd3" font-size="9">Browser WebGPU</text>

      <!-- WGPU (experimental) -->
      <rect x="600" y="0" width="130" height="48" rx="8" fill="#e11d48" opacity="0.25"/>
      <text x="665" y="22" text-anchor="middle" fill="white" font-size="11" font-weight="500">render/wgpu</text>
      <text x="665" y="38" text-anchor="middle" fill="#fecdd3" font-size="9">⚠ Experimental</text>

      <!-- Sun (experimental) -->
      <rect x="750" y="0" width="130" height="48" rx="8" fill="#e11d48" opacity="0.2"/>
      <text x="815" y="22" text-anchor="middle" fill="white" font-size="11" font-weight="500">render/sun</text>
      <text x="815" y="38" text-anchor="middle" fill="#fecdd3" font-size="9">⚠ Experimental</text>
    </g>

    <!-- Down arrow -->
    <line x1="500" y1="146" x2="500" y2="162" stroke="#fb7185" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- ==================== LAYER 7: Native / Platform ==================== -->
  <g transform="translate(0, 866)">
    <text x="30" y="16" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="2">07 — NATIVE PLATFORM</text>

    <g transform="translate(0, 28)">
      <!-- moui_skia -->
      <rect x="80" y="0" width="160" height="52" rx="10" fill="url(#nativeGrad)" filter="url(#shadow)" opacity="0.8"/>
      <text x="160" y="22" text-anchor="middle" fill="white" font-size="12" font-weight="600">moui_skia</text>
      <text x="160" y="38" text-anchor="middle" fill="#cbd5e1" font-size="9">Skia FFI Binding</text>

      <!-- moui_sun -->
      <rect x="260" y="0" width="140" height="52" rx="10" fill="url(#nativeGrad)" filter="url(#shadow)" opacity="0.5"/>
      <text x="330" y="22" text-anchor="middle" fill="white" font-size="12" font-weight="500">moui_sun</text>
      <text x="330" y="38" text-anchor="middle" fill="#cbd5e1" font-size="9">CPU Raster ⚠</text>

      <!-- wgpu_mbt -->
      <rect x="420" y="0" width="120" height="52" rx="10" fill="url(#nativeGrad)" filter="url(#shadow)" opacity="0.5"/>
      <text x="480" y="22" text-anchor="middle" fill="white" font-size="12" font-weight="500">wgpu_mbt</text>
      <text x="480" y="38" text-anchor="middle" fill="#cbd5e1" font-size="9">Diagnostic ⚠</text>

      <!-- Platform Host Surfaces -->
      <rect x="560" y="0" width="340" height="52" rx="10" fill="url(#nativeGrad)" filter="url(#shadow)" opacity="0.6"/>
      <text x="730" y="20" text-anchor="middle" fill="white" font-size="11" font-weight="600">Platform Host Surfaces</text>
      <text x="730" y="36" text-anchor="middle" fill="#cbd5e1" font-size="9">Metal · Vulkan · D3D12 · EGL · Canvas2D · WebGPU</text>
      <text x="730" y="48" text-anchor="middle" fill="#94a3b8" font-size="8">wzzc-dev/window · SurfaceContext</text>
    </g>
  </g>

  <!-- ==================== CROSS-CUTTING: Theme ==================== -->
  <g transform="translate(870, 320)">
    <rect x="0" y="0" width="90" height="260" rx="10" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
    <text x="45" y="24" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="600" letter-spacing="1">THEME</text>
    <text x="45" y="50" text-anchor="middle" fill="#c084fc" font-size="8.5" text-anchor="middle">moui_theme</text>
    <text x="45" y="72" text-anchor="middle" fill="#7c3aed" font-size="7.5">Material</text>
    <text x="45" y="86" text-anchor="middle" fill="#7c3aed" font-size="7.5">Carbon</text>
    <text x="45" y="100" text-anchor="middle" fill="#7c3aed" font-size="7.5">Primer</text>
    <text x="45" y="114" text-anchor="middle" fill="#7c3aed" font-size="7.5">Fluent</text>
    <text x="45" y="128" text-anchor="middle" fill="#7c3aed" font-size="7.5">Sickle</text>
    <line x1="45" y1="144" x2="45" y2="240" stroke="#a855f7" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.3"/>
    <text x="45" y="168" text-anchor="middle" fill="#a855f7" font-size="7.5" transform="rotate(-90, 45, 168)">Optional Addon</text>
  </g>

  <!-- ==================== DEPENDENCY ARROWS (left side) ==================== -->
  <g opacity="0.3">
    <!-- App → Views -->
    <line x1="160" y1="170" x2="160" y2="260" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <!-- Views → Core -->
    <line x1="160" y1="300" x2="160" y2="360" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowYellow)"/>
    <!-- Core → Runtime -->
    <line x1="160" y1="400" x2="160" y2="460" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowRed)"/>
    <!-- Runtime → Backend -->
    <line x1="160" y1="520" x2="160" y2="585" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
    <!-- Backend → Render -->
    <line x1="160" y1="660" x2="160" y2="740" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowPink)"/>
    <!-- Render → Native -->
    <line x1="160" y1="800" x2="160" y2="900" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  </g>

  <!-- ==================== LEGEND ==================== -->
  <g transform="translate(100, 1020)">
    <text x="0" y="12" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1">LEGEND</text>
    <g transform="translate(0, 26)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#2563eb"/>
      <text x="16" y="9" fill="#94a3b8" font-size="9">Application</text>
      <rect x="100" y="0" width="10" height="10" rx="2" fill="#059669"/>
      <text x="116" y="9" fill="#94a3b8" font-size="9">Public API / Views</text>
      <rect x="230" y="0" width="10" height="10" rx="2" fill="#d97706"/>
      <text x="246" y="9" fill="#94a3b8" font-size="9">Core Contracts</text>
      <rect x="340" y="0" width="10" height="10" rx="2" fill="#dc2626"/>
      <text x="356" y="9" fill="#94a3b8" font-size="9">Runtime</text>
      <rect x="430" y="0" width="10" height="10" rx="2" fill="#9333ea"/>
      <text x="446" y="9" fill="#94a3b8" font-size="9">Backend</text>
      <rect x="520" y="0" width="10" height="10" rx="2" fill="#e11d48"/>
      <text x="536" y="9" fill="#94a3b8" font-size="9">Renderer</text>
      <rect x="610" y="0" width="10" height="10" rx="2" fill="#475569"/>
      <text x="626" y="9" fill="#94a3b8" font-size="9">Native Platform</text>
    </g>
    <g transform="translate(0, 48)">
      <line x1="0" y1="5" x2="12" y2="5" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="16" y="9" fill="#94a3b8" font-size="9">Cross-cutting addon</text>
      <text x="180" y="9" fill="#94a3b8" font-size="9">★ = Mainline     ⚠ = Experimental     ○ = Diagnostic</text>
    </g>
  </g>
</svg>
