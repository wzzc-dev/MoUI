<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoUI Website Wasm GC</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='28' font-family='Arial' font-weight='700' fill='%23ffffff'%3EM%3C/text%3E%3C/svg%3E" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #f6f7f9;
        color: #111111;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      }

      #renderer-badge {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 6px 12px;
        border-radius: 6px;
        font: 11px/1.4 "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 0, 0, 0.12);
        color: #555;
        pointer-events: none;
        user-select: none;
      }

      body.canvas2d #renderer-badge {
        display: block;
        background: rgba(255, 247, 237, 0.9);
        border-color: rgba(234, 179, 8, 0.3);
        color: #92400e;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
        outline: none;
        touch-action: none;
      }

      #canvas-host {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .moui-text-selection-layer {
        overflow: hidden;
        pointer-events: none;
        cursor: default;
        user-select: text;
        -webkit-user-select: text;
      }

      .moui-text-selection-layer span {
        pointer-events: auto;
        user-select: text;
        -webkit-user-select: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        white-space: pre;
        cursor: inherit;
        font-kerning: none;
        font-variant-ligatures: none;
        font-feature-settings: "kern" 0, "liga" 0, "clig" 0, "calt" 0;
        text-rendering: geometricPrecision;
      }

      .moui-text-selection-layer span::selection {
        background: rgba(37, 99, 235, 0.24);
        color: transparent;
        -webkit-text-fill-color: transparent;
      }

      #diagnostics {
        display: none;
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: min(520px, calc(100vw - 24px));
        max-height: 40vh;
        overflow: auto;
        padding: 12px;
        border: 1px solid rgba(0, 0, 0, 0.16);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.14);
        font: 12px/1.45 "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
      }

      body.debug #diagnostics,
      body.failed #diagnostics {
        display: block;
      }

      #status {
        font-weight: 600;
        margin-bottom: 8px;
      }

      #log {
        margin: 0;
        white-space: pre-wrap;
      }
      /* ---- 静态降级视图(fallback.js)---- */
      #fallback-view {
        display: none;
        position: fixed;
        inset: 0;
        overflow: auto;
        background: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      body.fallback #fallback-view {
        display: block;
      }

      body.fallback #canvas-host,
      body.fallback #renderer-badge {
        display: none;
      }

      body.fallback #diagnostics {
        display: none;
      }

      #fallback-hero {
        display: block;
        width: 100%;
      }

      .fallback-content {
        max-width: 960px;
        margin: 0 auto;
        padding: 4px 20px 48px;
      }

      .fallback-langs {
        margin: 14px 0 4px;
      }

      .fallback-langs button {
        background: #1e293b;
        color: #cbd5e1;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 4px 12px;
        margin-right: 8px;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }

      .fallback-langs button.active {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
      }

      .fallback-notice {
        background: #1e293b;
        border: 1px solid #334155;
        border-left: 4px solid #f59e0b;
        border-radius: 10px;
        padding: 14px 16px;
        margin: 18px 0 6px;
        font-size: 14px;
        line-height: 1.65;
      }

      .fallback-notice strong {
        display: block;
        color: #fbbf24;
        margin-bottom: 4px;
      }

      .fallback-hint {
        color: #94a3b8;
        font-size: 12.5px;
        margin-top: 6px;
        line-height: 1.5;
      }

      .fallback-back {
        display: inline-block;
        margin: 16px 0 0;
        background: #1e293b;
        color: #93c5fd;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 7px 14px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
      }

      .fallback-back:hover {
        border-color: #3b82f6;
      }

      .fallback-section-title {
        font-size: 20px;
        font-weight: 700;
        margin: 26px 0 6px;
        color: #f8fafc;
      }

      .fallback-group {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #94a3b8;
        margin: 22px 0 4px;
      }

      .fallback-entry {
        display: block;
        width: 100%;
        text-align: left;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 12px 16px;
        margin: 8px 0;
        color: #e2e8f0;
        cursor: pointer;
        font-family: inherit;
      }

      .fallback-entry:hover {
        border-color: #3b82f6;
        background: #24324a;
      }

      .fallback-entry .t {
        display: block;
        font-size: 15px;
        font-weight: 600;
        color: #f8fafc;
      }

      .fallback-entry .s {
        display: block;
        font-size: 13px;
        color: #94a3b8;
        margin-top: 3px;
        line-height: 1.5;
      }

      .fallback-doc {
        background: #111c33;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 24px 28px;
        margin-top: 16px;
        line-height: 1.7;
        font-size: 14.5px;
      }

      .fallback-doc h1 {
        font-size: 26px;
        margin: 0 0 14px;
        color: #f8fafc;
      }

      .fallback-doc h2 {
        font-size: 20px;
        margin: 26px 0 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid #334155;
        color: #f8fafc;
      }

      .fallback-doc h3 {
        font-size: 16.5px;
        margin: 22px 0 8px;
        color: #e2e8f0;
      }

      .fallback-doc h4,
      .fallback-doc h5,
      .fallback-doc h6 {
        font-size: 14.5px;
        margin: 18px 0 6px;
        color: #cbd5e1;
      }

      .fallback-doc a {
        color: #60a5fa;
      }

      .fallback-doc code {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 5px;
        padding: 1px 5px;
        font-size: 13px;
        font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
      }

      .fallback-doc blockquote {
        margin: 12px 0;
        padding: 4px 16px;
        border-left: 3px solid #3b82f6;
        color: #94a3b8;
        background: #0f172a;
        border-radius: 0 8px 8px 0;
      }

      .fallback-doc img {
        max-width: 100%;
        border-radius: 8px;
      }

      .fallback-doc ul,
      .fallback-doc ol {
        padding-left: 24px;
        margin: 8px 0;
      }

      .fallback-doc li {
        margin: 4px 0;
      }

      .fallback-doc hr {
        border: none;
        border-top: 1px solid #334155;
        margin: 20px 0;
      }

      .fallback-loading,
      .fallback-error {
        color: #94a3b8;
      }

      .fallback-error code {
        white-space: pre-wrap;
      }

      .fallback-markdown {
        background: #0b1120;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 16px 20px;
        margin: 12px 0;
        overflow: auto;
        font: 13px/1.55 "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }

      .fallback-table {
        border-collapse: collapse;
        width: 100%;
        margin: 12px 0;
        font-size: 13px;
      }

      .fallback-table th,
      .fallback-table td {
        border: 1px solid #334155;
        padding: 6px 10px;
        text-align: left;
        vertical-align: top;
      }

      .fallback-table th {
        background: #1e293b;
        color: #f1f5f9;
      }

      #fallback-gallery-canvas {
        display: block;
        width: 100%;
        border: 1px solid #1e293b;
        border-radius: 12px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="canvas-host" aria-label="MoUI website canvas host"></div>
    <aside id="diagnostics" aria-live="polite">
      <div id="status">Loading wasm-gc...</div>
      <pre id="log"></pre>
    </aside>
    <div id="renderer-badge">Canvas2D</div>
    <!-- 静态降级视图:无 WebAssembly / 无 wasm-gc 的浏览器渲染此视图(内容由 fallback.js 注入) -->
    <div id="fallback-view" hidden></div>

    <script>
      // 完全无 WebAssembly 的浏览器(如 IE11、2017 年前的 Safari)同步判定,零下载立即降级。
      // 有 WebAssembly 但缺少 wasm-gc 的浏览器由下方 module 脚本 fetch+validate 判定。
      window.__mouiWasmUnsupported = typeof WebAssembly === "undefined";
    </script>
    <script src="fallback.js"></script>

    <script type="module">
      import { bootMouiWasmGcApp } from "../../moui_web_renderer/runtime.js";

      const wasmUrl = new URL(
        "../../_build/wasm-gc/debug/build/website/web_wasm/web_wasm.wasm",
        import.meta.url,
      );

      if (new URLSearchParams(window.location.search).get("debug") === "1") {
        document.body.classList.add("debug");
      }

      // 静态降级视图:无 wasm 或非 wasm-gc 引擎。fallback.js 暴露全局函数。
      const showFallback = reason => {
        document.body.classList.add("fallback");
        document.getElementById("fallback-view").hidden = false;
        if (typeof window.mouiShowFallback === "function") {
          window.mouiShowFallback({ reason });
        }
      };

      const status = document.querySelector("#status");
      const log = document.querySelector("#log");
      let line = "";

      const append = message => {
        log.textContent += `${message}\n`;
        log.scrollTop = log.scrollHeight;
      };

      const setStatus = message => {
        status.textContent = message;
        append(message);
        // Show Canvas2D badge if we detect fallback
        if (message === "WebGPU unavailable; switching to Canvas2D renderer.") {
          document.body.classList.add("canvas2d");
        }
      };

      // 加载策略:先同步判定无 wasm → 降级;否则 fetch 主模块并 validate。
      // validate 失败即非 wasm-gc 引擎(如 2023 年底前的 Chrome/Firefox/Safari)→ 降级,不执行。
      // validate 通过后再交给 bootMouiWasmGcApp(fetch 命中 HTTP 缓存,开销可忽略)。
      const startApp = () =>
        bootMouiWasmGcApp({
          wasmUrl,
          canvasHost: "#canvas-host",
          webgpu: {
            textSelection: {
              enabled: true,
            },
          },
          onStatus: setStatus,
          onPrint(ch) {
            if (ch === "\n") {
              append(line);
              line = "";
            } else {
              line += ch;
            }
          },
        });

      (async () => {
        if (window.__mouiWasmUnsupported) {
          showFallback("no-wasm");
          return;
        }
        try {
          const response = await fetch(wasmUrl);
          if (!response.ok) {
            throw new Error(`Failed to fetch wasm module: HTTP ${response.status}`);
          }
          const bytes = await response.arrayBuffer();
          if (!WebAssembly.validate(bytes)) {
            // 引擎存在但缺少 wasm-gc 支持。
            showFallback("no-wasm-gc");
            return;
          }
          await startApp();
        } catch (error) {
          // fetch/validate 或 app 启动失败:按原有错误路径展示。
          document.body.classList.add("failed");
          status.textContent = "Failed";
          append(error.stack || String(error));
          console.error(error);
          return;
        }
        status.textContent = "Running";
        append("MoonBit wasm-gc started.");
        // Keep canvas filling the viewport and notify MoonBit runtime
        const canvas = document.querySelector("canvas");
        const host = document.getElementById("canvas-host");
        console.log('[BOOT-DEBUG] .then() fired:', {
          hasCanvas: !!canvas,
          hasHost: !!host,
          canvas: canvas ? { id: canvas.id, w: canvas.width, h: canvas.height, clientW: canvas.clientWidth, clientH: canvas.clientHeight, styleW: canvas.style.width, styleH: canvas.style.height } : null,
          host: host ? { clientW: host.clientWidth, clientH: host.clientHeight } : null,
          window: { innerW: window.innerWidth, innerH: window.innerHeight, dpr: window.devicePixelRatio },
        });
        // Dispatch initial resize so MoonBit runtime uses viewport size
        if (canvas && host) {
          const resizeCanvasToViewport = () => {
            const w = host.clientWidth || window.innerWidth || 1;
            const h = host.clientHeight || window.innerHeight || 1;
            const dpr = window.devicePixelRatio || 1;
            console.log('[BOOT-DEBUG] resizeCanvasToViewport before:', { targetW: w, targetH: h, canvasW: canvas.width, canvasH: canvas.height });
            if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
              canvas.width = Math.max(1, Math.round(w * dpr));
              canvas.height = Math.max(1, Math.round(h * dpr));
              canvas.style.width = `${w}px`;
              canvas.style.height = `${h}px`;
              console.log('[BOOT-DEBUG] resizeCanvasToViewport after resize:', { w: canvas.width, h: canvas.height, styleW: canvas.style.width, styleH: canvas.style.height, clientW: canvas.clientWidth, clientH: canvas.clientHeight });
            } else {
              console.log('[BOOT-DEBUG] resizeCanvasToViewport: no change needed');
            }
            // Dispatch synthetic resize to notify MoonBit runtime
            console.log('[BOOT-DEBUG] dispatching window.resize event...');
            window.dispatchEvent(new Event("resize"));
            console.log('[BOOT-DEBUG] after dispatchEvent, canvas:', { w: canvas.width, h: canvas.height, clientW: canvas.clientWidth, clientH: canvas.clientHeight });
          };
          // Fire immediately to set initial size
          resizeCanvasToViewport();
          // Also observe for future resizes
          if (typeof ResizeObserver === "function") {
            console.log('[BOOT-DEBUG] setting up ResizeObserver');
            const ro = new ResizeObserver(entries => {
              console.log('[BOOT-DEBUG] ResizeObserver fired:', entries.map(e => ({ contentRect: e.contentRect })));
              resizeCanvasToViewport();
            });
            ro.observe(host);
          }
        }
      })();
    </script>
  </body>
</html>
