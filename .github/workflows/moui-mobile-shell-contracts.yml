name: MoUI Mobile Shell Contracts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/moui-mobile-shell-contracts.yml"
      - "moui/mobile/**"
      - "moui/scripts/mobile/**"
      - "moui_cli/**"
      - "scripts/*-mobile-runtime-evidence.sh"
      - "scripts/build-mobile-*.sh"
      - "scripts/check-mobile-app-config.mjs"
      - "scripts/lib/mobile-runtime-log.mjs"
      - "scripts/record-mobile-runtime-smoke.mjs"
      - "scripts/test-validate-mobile-runtime-manifest.mjs"
      - "scripts/validate-mobile-runtime-manifest.mjs"
      - "scripts/setup-android-sdk.sh"
      - "tools/moui/validate_mobile_runtime_manifest/**"
      - "examples/component_gallery/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/moui-mobile-shell-contracts.yml"
      - "moui/mobile/**"
      - "moui/scripts/mobile/**"
      - "moui_cli/**"
      - "scripts/*-mobile-runtime-evidence.sh"
      - "scripts/build-mobile-*.sh"
      - "scripts/check-mobile-app-config.mjs"
      - "scripts/lib/mobile-runtime-log.mjs"
      - "scripts/record-mobile-runtime-smoke.mjs"
      - "scripts/test-validate-mobile-runtime-manifest.mjs"
      - "scripts/validate-mobile-runtime-manifest.mjs"
      - "scripts/setup-android-sdk.sh"
      - "tools/moui/validate_mobile_runtime_manifest/**"
      - "examples/component_gallery/**"
  workflow_dispatch:
    inputs:
      run_harmonyos_hvigor:
        description: Run the real managed/plugin Hvigor build on a HarmonyOS runner.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-shell-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    name: Plugin, ABI, and shell static contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install MoonBit dependencies
        run: sh scripts/ci-moon-update.sh

      - name: Validate mobile plugin and canonical shell contracts
        run: |
          node --test moui/scripts/mobile/plugin-manifest.test.mjs
          node --test moui/mobile/android/prepare-plugins.test.mjs
          node --test moui/mobile/test-probe/tests/validate-test-probe.mjs
          sh moui/mobile/tests/run-mobile-runtime-v1-tests.sh
          node moui/mobile/ios/tests/validate-managed-shell.mjs
          node --test moui/mobile/harmonyos/tests/validate-managed-shell.mjs
          node --test moui/mobile/harmonyos/tests/validate-plugin-capabilities.mjs
          node scripts/test-validate-mobile-runtime-manifest.mjs
          moon test tools/moui/validate_mobile_runtime_manifest --target native
          moon test moui_cli --target native

      - name: Reject generated artifact drift
        run: |
          git diff --exit-code
          if git status --short -- artifacts | grep -q .; then
            echo "mobile shell CI must not create tracked artifacts" >&2
            exit 1
          fi

  android-shells:
    name: Android managed, ejected, plugin, and Release N shells
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install MoonBit dependencies
        run: sh scripts/ci-moon-update.sh

      - name: Install Android SDK, NDK, and CMake
        run: scripts/setup-android-sdk.sh --accept-licenses

      - name: Build Android shell matrix
        shell: bash
        run: |
          eval "$(scripts/setup-android-sdk.sh --print-env)"
          moui/mobile/test-probe/tests/run-mobile-shell-matrix.sh android --fallback-skia

      - name: Upload Android packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moui-android-shell-contracts
          path: artifacts/mobile-shell-ci/android/**
          if-no-files-found: warn

  ios-shells:
    name: iOS managed, ejected, plugin, and Release N shells
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install MoonBit dependencies
        run: sh scripts/ci-moon-update.sh

      - name: Build iOS shell matrix
        run: moui/mobile/test-probe/tests/run-mobile-shell-matrix.sh ios --fallback-skia

      - name: Upload iOS packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moui-ios-shell-contracts
          path: artifacts/mobile-shell-ci/ios/**
          if-no-files-found: warn

  harmonyos-fallback-shells:
    name: HarmonyOS fallback shell packaging matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build zip

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install MoonBit dependencies
        run: sh scripts/ci-moon-update.sh

      - name: Build HarmonyOS shell packaging matrix
        run: moui/mobile/test-probe/tests/run-mobile-shell-matrix.sh harmonyos --fallback-skia

      - name: Upload HarmonyOS packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moui-harmonyos-shell-contracts
          path: |
            artifacts/mobile-shell-ci/harmonyos/**
            artifacts/harmonyos/component-gallery-legacy-fixture/**
          if-no-files-found: warn

  harmonyos-hvigor-plugin:
    name: HarmonyOS managed plugin Hvigor compile
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_harmonyos_hvigor }}
    runs-on: [self-hosted, harmonyos]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install MoonBit dependencies
        run: sh scripts/ci-moon-update.sh

      - name: Compile managed and plugin shells with Hvigor
        run: moui/mobile/test-probe/tests/build-harmonyos-hvigor-fixture.sh

      - name: Upload HarmonyOS Hvigor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moui-harmonyos-hvigor-plugin
          path: artifacts/mobile-shell-ci/harmonyos/**
          if-no-files-found: warn
