name: MoUI Android Shell Runtime Evidence

on:
  workflow_dispatch:
    inputs:
      app:
        description: Shell app id to smoke
        required: false
        default: showcase
        type: choice
        options:
          - showcase
          - counter
      renderer:
        description: Skia renderer selection
        required: false
        default: auto
        type: choice
        options:
          - auto
          - skia-gpu
          - skia-raster
      avd:
        description: AVD name when no device is attached
        required: false
        default: moui_api34
        type: string

jobs:
  android-shell-runtime-evidence:
    name: Android MoUI Showcase runtime smoke
    # Prefer self-hosted runners with a ready emulator/device and NDK 28.2.
    # GitHub-hosted images may lack the pinned NDK / GPU path.
    runs-on: [self-hosted, android]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Update MoonBit registry
        shell: bash
        run: scripts/ci-moon-update.sh

      - name: Run Android shell runtime evidence
        shell: bash
        env:
          MOUI_EMBEDDING_APP: ${{ inputs.app || 'showcase' }}
          MOUI_SKIA_RENDERER: ${{ inputs.renderer || 'auto' }}
          MOUI_ANDROID_AVD: ${{ inputs.avd || 'moui_api34' }}
        run: |
          chmod +x scripts/android-shell-runtime-evidence.sh
          scripts/android-shell-runtime-evidence.sh

      - name: Upload Android shell runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moui-android-shell-runtime-evidence
          path: |
            artifacts/shell-runtime/android/**
            artifacts/android/**
          if-no-files-found: warn
