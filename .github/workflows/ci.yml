name: MoUI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: Core conformance
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Restore local window dependency
        run: sh scripts/setup-local-deps.sh

      - name: Check local dependency wiring
        run: sh scripts/check-local-deps.sh

      - name: Run conformance checks
        run: sh scripts/conformance-check.sh

      - name: Build golden preview target
        run: sh scripts/conformance-check.sh --golden
