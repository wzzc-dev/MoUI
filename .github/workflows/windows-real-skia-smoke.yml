name: Windows Real Skia Smoke

on:
  workflow_dispatch:
    inputs:
      skia_include:
        description: Existing Skia checkout/include root; falls back to SKIA_MBT_SKIA_INCLUDE on the runner
        required: false
        default: ""
      skia_lib_dir:
        description: Existing directory containing MinGW-compatible libskia.a or skia.lib; falls back to SKIA_MBT_SKIA_LIB_DIR on the runner
        required: false
        default: ""
      skia_lib:
        description: Library name without prefix/suffix
        required: false
        default: skia
      extra_cc_flags:
        description: Extra C/C++ flags
        required: false
        default: ""
      extra_link_flags:
        description: Extra linker flags
        required: false
        default: ""
      dry_run_config:
        description: Print resolved config without building the smoke binary or rewriting native/moon.pkg
        type: boolean
        required: false
        default: false

jobs:
  smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Preflight smoke configuration
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          New-Item -ItemType Directory -Force -Path .skia-dry-run/skia/include/core | Out-Null
          New-Item -ItemType Directory -Force -Path .skia-dry-run/lib | Out-Null
          New-Item -ItemType File -Force -Path .skia-dry-run/skia/include/core/SkSurface.h | Out-Null
          New-Item -ItemType File -Force -Path ".skia-dry-run/lib/lib${{ inputs.skia_lib }}.a" | Out-Null
          .\scripts\windows-skia-smoke.ps1 `
            -SkiaInclude .skia-dry-run/skia `
            -SkiaLibDir .skia-dry-run/lib `
            -SkiaLib "${{ inputs.skia_lib }}" `
            -ExtraCcFlags "${{ inputs.extra_cc_flags }}" `
            -ExtraLinkFlags "${{ inputs.extra_link_flags }}" `
            -DryRunConfig 2>&1 | Tee-Object -FilePath logs/windows-real-skia-smoke-preflight.log

      - name: Set up MoonBit
        if: ${{ !inputs.dry_run_config }}
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Run native smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          if ("${{ inputs.dry_run_config }}" -eq "true") {
            "dry_run_config=true; real Windows smoke was not run" | Tee-Object -FilePath logs/windows-real-skia-smoke.log
            exit 0
          }
          $args = @("-LogDir", "logs")
          if (![string]::IsNullOrWhiteSpace("${{ inputs.skia_include }}")) {
            $args += @("-SkiaInclude", "${{ inputs.skia_include }}")
          }
          if (![string]::IsNullOrWhiteSpace("${{ inputs.skia_lib_dir }}")) {
            $args += @("-SkiaLibDir", "${{ inputs.skia_lib_dir }}")
          }
          if (![string]::IsNullOrWhiteSpace("${{ inputs.skia_lib }}")) {
            $args += @("-SkiaLib", "${{ inputs.skia_lib }}")
          }
          if (![string]::IsNullOrWhiteSpace("${{ inputs.extra_cc_flags }}")) {
            $args += @("-ExtraCcFlags", "${{ inputs.extra_cc_flags }}")
          }
          if (![string]::IsNullOrWhiteSpace("${{ inputs.extra_link_flags }}")) {
            $args += @("-ExtraLinkFlags", "${{ inputs.extra_link_flags }}")
          }
          .\scripts\windows-accept-real-skia-smoke.ps1 @args

      - name: Verify native smoke success marker
        if: ${{ always() && !inputs.dry_run_config }}
        shell: pwsh
        run: .\scripts\verify-native-smoke-log.ps1 -LogPath logs\windows-native-smoke-output.log

      - name: Verify acceptance summary
        if: ${{ always() && !inputs.dry_run_config }}
        shell: pwsh
        run: .\scripts\verify-acceptance-log.ps1 -LogPath logs\windows-real-skia-acceptance.log

      - name: Verify real Skia artifact bundle
        if: ${{ always() && !inputs.dry_run_config }}
        shell: pwsh
        run: .\scripts\verify-real-skia-artifact.ps1 -Platform windows -LogDir logs

      - name: Verify pinned Skia revision match
        if: ${{ always() && !inputs.dry_run_config }}
        shell: pwsh
        run: .\scripts\verify-skia-revision-pin.ps1 -AcceptanceLog logs\windows-real-skia-acceptance.log -SkipIfUnpinned

      - name: Upload smoke log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-real-skia-smoke-log
          path: |
            logs/windows-real-skia-smoke-preflight.log
            logs/windows-real-skia-smoke.log
            logs/windows-native-smoke-output.log
            logs/windows-real-skia-acceptance.log
          if-no-files-found: warn

      - name: Verify native package restored
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath native/moon.pkg.smoke.bak) {
            throw "native/moon.pkg smoke backup is still present"
          }
          git diff --exit-code -- native/moon.pkg
          if ($LASTEXITCODE -ne 0) {
            throw "native/moon.pkg differs after Windows Skia smoke"
          }

      - name: Write workflow summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $resolvedCommit = "not run"
          if ($env:windows_skia_commit) {
            $resolvedCommit = $env:windows_skia_commit
          } elseif (Test-Path -LiteralPath logs/windows-real-skia-smoke.log) {
            $commitLine = Select-String -LiteralPath logs/windows-real-skia-smoke.log -Pattern '^\s*skia_commit=' | Select-Object -Last 1
            if ($commitLine) {
              $resolvedCommit = $commitLine.Line -replace '^\s*skia_commit=', ''
            }
          }
          $markerStatus = if ($env:native_smoke_marker_status) { $env:native_smoke_marker_status } else { "not run" }
          $restoreStatus = if ($env:restore_status) { $env:restore_status } else { "not run" }
          @(
            "## Windows Real Skia Smoke"
            ""
            "- Dry run only: ${{ inputs.dry_run_config }}"
            "- Existing Skia include: ${{ inputs.skia_include }}"
            "- Existing Skia lib dir: ${{ inputs.skia_lib_dir }}"
            "- Skia library: ${{ inputs.skia_lib }}"
            "- Resolved Skia commit: $resolvedCommit"
            "- Extra C/C++ flags: ${{ inputs.extra_cc_flags }}"
            "- Extra link flags: ${{ inputs.extra_link_flags }}"
            "- Artifact: windows-real-skia-smoke-log"
            "- Preflight log: logs/windows-real-skia-smoke-preflight.log"
            "- Smoke log: logs/windows-real-skia-smoke.log"
            "- Native smoke executable log: logs/windows-native-smoke-output.log"
            "- Acceptance log: logs/windows-real-skia-acceptance.log"
            "- Native smoke success marker: $markerStatus"
            "- native/moon.pkg restore check: $restoreStatus"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
