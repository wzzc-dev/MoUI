name: MoUI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_slow_native_examples:
        description: Build current-platform Skia native examples on macOS and Linux.
        required: false
        default: false
        type: boolean

env:
  MOUI_WINDOW_REMOTE: https://github.com/wzzc-dev/window.git

jobs:
  conformance:
    name: Core conformance
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Restore local window dependency
        run: sh scripts/setup-local-deps.sh

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Check local dependency wiring
        run: sh scripts/check-local-deps.sh

      - name: Run daily development and guidance checks
        run: sh scripts/dev-check.sh

      - name: Run text conformance checks
        run: sh scripts/conformance-check.sh --text --text-diagnostic

      - name: Build showcase preview target
        run: sh scripts/conformance-check.sh --golden

  api-surface:
    name: Public API surface
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Restore local dependencies
        run: sh scripts/setup-local-deps.sh

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Generate public API interfaces
        run: moon info

      - name: Check generated interface drift
        run: git diff --exit-code -- '**/pkg.generated.mbti'

  linux-platform:
    name: Linux platform contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libwayland-bin wayland-protocols pkg-config unzip \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev fonts-noto-color-emoji

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Restore local dependencies
        run: sh scripts/setup-local-deps.sh

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Run Linux backend tests
        run: sh scripts/dev-check.sh --platform-examples-test

      - name: Build Linux native examples
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_slow_native_examples }}
        run: sh scripts/dev-check.sh --platform-examples-build

  macos-packaging:
    name: macOS packaging smoke
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Restore local dependencies
        run: sh scripts/setup-local-deps.sh

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Package Showcase app bundle
        run: |
          sh scripts/package-macos-app.sh \
            --package examples/showcase/macos_skia \
            --name "MoUI Showcase" \
            --bundle-id dev.wzzc.moui.showcase \
            --version 0.1.0 \
            --build-version "$GITHUB_RUN_NUMBER"

      - name: Build macOS native examples
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_slow_native_examples }}
        run: |
          moon build examples/showcase/macos_skia --target native
          moon build examples/markdown_editor/macos_skia --target native

      - name: Upload macOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: moui-showcase-macos-app
          path: dist/macos/MoUI Showcase.app
          if-no-files-found: error

  benchmark-scaffold:
    name: Benchmark scaffold
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Restore local dependencies
        run: sh scripts/setup-local-deps.sh

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Build benchmark targets
        run: sh scripts/conformance-check.sh --bench

  windows-native:
    name: Windows MSVC native smoke
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up vcpkg zlib
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows\setup_msvc_deps.ps1 -InstallZlib

      - name: Set up MoonBit
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing https://cli.moonbitlang.com/install/powershell.ps1 -OutFile install-moonbit.ps1
          ./install-moonbit.ps1
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore local dependencies
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows\update_repositories.ps1 -SkipRoot -SkipSubmodules

      - name: Install dependencies
        shell: pwsh
        run: |
          moon version --all
          moon update

      - name: Run Windows backend tests
        shell: pwsh
        run: |
          . .\scripts\windows\msvc_env.ps1
          moon test moui/backend/windows --target native
          Enable-MsvcC11Atomics
          moon test moui/backend/windows/skia --target native

      - name: Build Showcase Windows Skia entrypoint with MSVC
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows\build_windows_msvc.ps1 -Package examples/showcase/windows_skia -BuildOnly

      - name: Package Showcase Windows Skia folder with MSVC
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\windows\package_windows_app_msvc.ps1 `
            -Package examples/showcase/windows_skia `
            -AppName MoUIShowcase `
            -Version 0.1.0 `
            -BuildNumber $env:GITHUB_RUN_NUMBER

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: moui-showcase-windows-msvc-portable
          path: dist/windows-msvc/MoUIShowcase
          if-no-files-found: error

  renderer-proof-wgpu-native:
    name: Native WGPU renderer diagnostic (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native Linux dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libwayland-bin wayland-protocols pkg-config unzip \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev fonts-noto-color-emoji \
            libvulkan1 mesa-vulkan-drivers vulkan-tools

      - name: Configure Linux software Vulkan adapter
        if: ${{ matrix.platform == 'linux' }}
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          export WGPU_BACKEND=vulkan
          echo "LIBGL_ALWAYS_SOFTWARE=$LIBGL_ALWAYS_SOFTWARE" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=$WGPU_BACKEND" >> "$GITHUB_ENV"
          LVP_ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1 || true)"
          if [ -n "$LVP_ICD" ]; then
            echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          else
            echo "::warning::lavapipe Vulkan ICD not found under /usr/share/vulkan/icd.d"
          fi
          vulkaninfo --summary || true

      - name: Install native macOS emoji font
        if: ${{ matrix.platform == 'macos' }}
        run: brew list --cask font-noto-color-emoji >/dev/null 2>&1 || brew install --cask font-noto-color-emoji

      - name: Set up vcpkg zlib
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows\setup_msvc_deps.ps1 -InstallZlib

      - name: Set up MoonBit
        if: ${{ matrix.platform != 'windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Set up MoonBit (Windows)
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing https://cli.moonbitlang.com/install/powershell.ps1 -OutFile install-moonbit.ps1
          ./install-moonbit.ps1
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore local dependencies
        if: ${{ matrix.platform != 'windows' }}
        run: sh scripts/setup-local-deps.sh

      - name: Restore local dependencies (Windows)
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows\update_repositories.ps1 -SkipRoot -SkipSubmodules

      - name: Set up WGPU native release (Windows)
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows\setup_wgpu_native.ps1

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Record native WGPU renderer proof
        if: ${{ matrix.platform != 'windows' }}
        env:
          MOUI_COSMIC_TEXT_DIAGNOSTICS: "1"
        run: node scripts/ci-renderer-proof-native.mjs wgpu-native ${{ matrix.platform }}

      - name: Record native WGPU renderer proof (Windows)
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        env:
          MOUI_COSMIC_TEXT_DIAGNOSTICS: "1"
        run: |
          . .\scripts\windows\msvc_env.ps1
          Enable-MsvcGlobalC11ModeForCOnlyStubs
          node scripts\ci-renderer-proof-native.mjs wgpu-native windows

      - name: Upload native WGPU renderer proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: moui-renderer-proof-wgpu-native-${{ matrix.platform }}
          path: |
            artifacts/conformance/renderer-proof/
            artifacts/platform-evidence/${{ matrix.platform }}/
          if-no-files-found: warn

  renderer-proof-skia-native:
    name: Native Skia renderer proof (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native Linux dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libwayland-bin wayland-protocols pkg-config unzip \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev fonts-noto-color-emoji

      - name: Set up vcpkg zlib
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows\setup_msvc_deps.ps1 -InstallZlib

      - name: Set up MoonBit
        if: ${{ matrix.platform != 'windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Set up MoonBit (Windows)
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing https://cli.moonbitlang.com/install/powershell.ps1 -OutFile install-moonbit.ps1
          ./install-moonbit.ps1
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore local dependencies
        if: ${{ matrix.platform != 'windows' }}
        run: sh scripts/setup-local-deps.sh

      - name: Restore local dependencies (Windows)
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows\update_repositories.ps1 -SkipRoot -SkipSubmodules

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Cache release Skia
        uses: actions/cache@v4
        with:
          path: moui_skia/.skia-cache/release
          key: renderer-proof-release-skia-${{ matrix.platform }}-${{ runner.arch }}-${{ hashFiles('moui_skia/skia-provider-lock.json') }}
          restore-keys: |
            renderer-proof-release-skia-${{ matrix.platform }}-${{ runner.arch }}-
            renderer-proof-release-skia-${{ matrix.platform }}-

      - name: Configure release Skia for renderer proof
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          bash moui_skia/scripts/fetch-release-skia.sh \
            --platform "${{ matrix.platform }}" \
            --arch auto \
            --config Release \
            --link-mode static \
            --print-env > "$env_file"
          while IFS='=' read -r key value; do
            if [[ -n "$key" ]]; then
              export "$key=$value"
              printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            fi
          done < "$env_file"
          case "${{ matrix.platform }}" in
            macos) bash moui_skia/scripts/configure-macos-native-pkg.sh --enable-skparagraph --require-skparagraph --write ;;
            linux) bash moui_skia/scripts/configure-linux-native-pkg.sh --enable-skparagraph --require-skparagraph --write ;;
          esac

      - name: Configure release Skia for renderer proof (Windows)
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $envLines = .\moui_skia\scripts\fetch-release-skia.ps1 `
            -Platform windows `
            -Arch auto `
            -Config Release `
            -LinkMode static `
            -PrintEnv
          foreach ($line in $envLines) {
            if ($line -match '^([^=]+)=(.*)$') {
              $key = $Matches[1]
              $value = $Matches[2]
              Set-Item -Path "Env:$key" -Value $value
              Add-Content -Path $env:GITHUB_ENV -Value "$key=$value"
            }
          }
          .\moui_skia\scripts\configure-windows-msvc-native-pkg.ps1 -EnableSkParagraph -RequireSkParagraph -Write

      - name: Record native Skia renderer proof
        if: ${{ matrix.platform != 'windows' }}
        run: node scripts/ci-renderer-proof-native.mjs skia-native ${{ matrix.platform }}

      - name: Record native Skia renderer proof (Windows)
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          . .\scripts\windows\msvc_env.ps1
          node scripts\ci-renderer-proof-native.mjs skia-native windows

      - name: Upload native Skia renderer proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: moui-renderer-proof-skia-native-${{ matrix.platform }}
          path: |
            artifacts/conformance/renderer-proof/
            artifacts/platform-evidence/${{ matrix.platform }}/
          if-no-files-found: warn

  web-runtime-presentation:
    name: Web runtime presentation
    runs-on: ubuntu-24.04
    env:
      WEB_RUNTIME_BASE_URL: http://127.0.0.1:18080
      WEB_RUNTIME_CDP_URL: http://127.0.0.1:9223
      WEB_RUNTIME_PRESENTATION_MANIFEST: artifacts/conformance/web-runtime-presentation.json
      WEB_RUNTIME_PRESENTATION_ARTIFACT_NAME: moui-web-runtime-presentation
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libwayland-bin wayland-protocols pkg-config unzip \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev fonts-noto-color-emoji

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Restore local dependencies
        run: sh scripts/setup-local-deps.sh

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Record Web runtime presentation evidence
        env:
          WEB_RUNTIME_CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: sh scripts/ci-web-runtime-presentation.sh

      - name: Upload Web runtime presentation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WEB_RUNTIME_PRESENTATION_ARTIFACT_NAME }}
          path: |
            artifacts/conformance/web-runtime-presentation.json
            artifacts/conformance/web-runtime-presentation/
            artifacts/conformance/renderer-proof/
            artifacts/platform-evidence/web/
            artifacts/conformance/platform-runtime-evidence.json
          if-no-files-found: warn

  renderer-proof-summary:
    name: Renderer proof summary
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs:
      - renderer-proof-skia-native
      - web-runtime-presentation
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download renderer proof artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/downloaded-renderer-proof

      - name: Validate renderer proof manifests
        run: sh scripts/ci-renderer-proof-summary.sh artifacts/downloaded-renderer-proof
