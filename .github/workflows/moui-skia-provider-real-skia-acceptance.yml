name: MoUI Skia Provider Real Skia Acceptance

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "moui_skia/**"
      - "moon.work"
      - "moui/moon.mod"
      - ".moonbit-toolchain"
      - ".github/actions/setup-moonbit/action.yml"
      - ".github/workflows/moui-skia-provider-real-skia-acceptance.yml"
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read

jobs:
  linux:
    name: Linux release Skia acceptance (${{ matrix.link_mode }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moui_skia
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        link_mode: [ static, dynamic ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Show MoonBit version
        shell: bash
        run: moon version --all

      - name: Update MoonBit registry
        shell: bash
        run: ../scripts/ci-moon-update.sh

      - name: Install build dependencies
        shell: bash
        run: bash scripts/install-linux-smoke-deps.sh

      - name: Verify build dependencies
        shell: bash
        run: bash scripts/install-linux-smoke-deps.sh --check

      - name: Cache release Skia
        uses: actions/cache@v4
        with:
          path: moui_skia/.skia-cache/release
          key: release-skia-linux-${{ matrix.link_mode }}-${{ runner.arch }}-${{ hashFiles('moui_skia/skia-provider-lock.json') }}
          restore-keys: |
            release-skia-linux-${{ matrix.link_mode }}-${{ runner.arch }}-
            release-skia-linux-${{ matrix.link_mode }}-
            release-skia-linux-

      - name: Run real Skia acceptance
        shell: bash
        run: |
          mkdir -p logs
          set -o pipefail
          bash scripts/linux-real-skia-smoke.sh \
            --skia-provider release \
            --link-mode "${{ matrix.link_mode }}" \
            --dry-run-config 2>&1 | tee logs/linux-real-skia-smoke-preflight.log
          bash scripts/linux-accept-real-skia-smoke.sh \
            --log-dir logs \
            --skia-provider release \
            --link-mode "${{ matrix.link_mode }}"

      - name: Verify real Skia artifact bundle
        shell: bash
        run: bash scripts/verify-real-skia-artifact.sh --platform linux --log-dir logs

      - name: Verify platform status can be accepted
        shell: bash
        run: |
          before_status="$(mktemp)"
          cp skia-platform-status.json "$before_status"
          bash scripts/accept-platform-status.sh \
            --platform linux \
            --log-dir logs \
            --artifact-label "github-actions:${GITHUB_RUN_ID}:linux-real-skia-acceptance:${{ matrix.link_mode }}"
          git diff -- skia-platform-status.json > logs/linux-platform-acceptance.patch
          cp "$before_status" skia-platform-status.json
          rm -f "$before_status"
          test -s logs/linux-platform-acceptance.patch

      - name: Verify package files restored
        if: ${{ always() }}
        shell: bash
        run: git diff --exit-code -- native/moon.pkg scripts/native_smoke/moon.pkg

      - name: Upload Linux acceptance logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-real-skia-acceptance-log-${{ matrix.link_mode }}
          path: |
            moui_skia/logs/linux-real-skia-smoke-preflight.log
            moui_skia/logs/linux-skia-build.log
            moui_skia/logs/linux-real-skia-smoke.log
            moui_skia/logs/linux-native-smoke-output.log
            moui_skia/logs/linux-real-skia-acceptance.log
            moui_skia/logs/linux-platform-acceptance.patch
          if-no-files-found: warn

  macos:
    name: macOS release Skia acceptance (${{ matrix.link_mode }})
    runs-on: macos-latest
    defaults:
      run:
        working-directory: moui_skia
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        link_mode: [ static, dynamic ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Show MoonBit version
        shell: bash
        run: moon version --all

      - name: Update MoonBit registry
        shell: bash
        run: ../scripts/ci-moon-update.sh

      - name: Install build dependencies
        shell: bash
        run: brew install ninja

      - name: Cache release Skia
        uses: actions/cache@v4
        with:
          path: moui_skia/.skia-cache/release
          key: release-skia-macos-${{ matrix.link_mode }}-${{ runner.arch }}-${{ hashFiles('moui_skia/skia-provider-lock.json') }}
          restore-keys: |
            release-skia-macos-${{ matrix.link_mode }}-${{ runner.arch }}-
            release-skia-macos-${{ matrix.link_mode }}-
            release-skia-macos-

      - name: Run real Skia acceptance
        shell: bash
        run: |
          bash scripts/macos-accept-real-skia-smoke.sh \
            --log-dir logs \
            --skia-provider release \
            --link-mode "${{ matrix.link_mode }}"

      - name: Verify real Skia artifact bundle
        shell: bash
        run: bash scripts/verify-real-skia-artifact.sh --platform macos --log-dir logs

      - name: Verify platform status can be accepted
        shell: bash
        run: |
          before_status="$(mktemp)"
          cp skia-platform-status.json "$before_status"
          bash scripts/accept-platform-status.sh \
            --platform macos \
            --log-dir logs \
            --artifact-label "github-actions:${GITHUB_RUN_ID}:macos-real-skia-acceptance:${{ matrix.link_mode }}"
          git diff -- skia-platform-status.json > logs/macos-platform-acceptance.patch
          cp "$before_status" skia-platform-status.json
          rm -f "$before_status"
          test -s logs/macos-platform-acceptance.patch

      - name: Verify package files restored
        if: ${{ always() }}
        shell: bash
        run: git diff --exit-code -- native/moon.pkg scripts/native_smoke/moon.pkg

      - name: Upload macOS acceptance logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-real-skia-acceptance-log-${{ matrix.link_mode }}
          path: |
            moui_skia/logs/macos-real-skia-smoke-preflight.log
            moui_skia/logs/macos-skia-build.log
            moui_skia/logs/macos-real-skia-smoke.log
            moui_skia/logs/macos-native-smoke-output.log
            moui_skia/logs/macos-real-skia-acceptance.log
            moui_skia/logs/macos-platform-acceptance.patch
          if-no-files-found: warn

  windows:
    name: Windows MSVC release Skia acceptance (${{ matrix.link_mode }})
    runs-on: windows-latest
    defaults:
      run:
        working-directory: moui_skia
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        link_mode: [ static, dynamic ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Show MoonBit version
        shell: pwsh
        run: moon version --all

      - name: Update MoonBit registry
        shell: bash
        run: ../scripts/ci-moon-update.sh

      - name: Resolve Visual Studio environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe was not found: $vswhere"
          }
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installPath)) {
            throw "Visual Studio C++ tools were not found"
          }
          $vcvarsall = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (!(Test-Path -LiteralPath $vcvarsall -PathType Leaf)) {
            throw "vcvarsall.bat was not found: $vcvarsall"
          }
          "VCVARSALL=$vcvarsall" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache release Skia
        uses: actions/cache@v4
        with:
          path: moui_skia/.skia-cache/release
          key: release-skia-windows-${{ matrix.link_mode }}-${{ runner.arch }}-${{ hashFiles('moui_skia/skia-provider-lock.json') }}
          restore-keys: |
            release-skia-windows-${{ matrix.link_mode }}-${{ runner.arch }}-
            release-skia-windows-${{ matrix.link_mode }}-
            release-skia-windows-

      - name: Run real Skia acceptance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $envLines = .\scripts\fetch-release-skia.ps1 `
            -Platform windows `
            -Arch auto `
            -Config Release `
            -LinkMode "${{ matrix.link_mode }}" `
            -PrintEnv
          $envMap = @{}
          foreach ($line in $envLines) {
            if ($line -match '^([^=]+)=(.*)$') {
              $envMap[$Matches[1]] = $Matches[2]
            }
          }
          $acceptArgs = @{
            LogDir = "logs"
            SkiaRoot = $envMap["MOUI_SKIA_SKIA_ROOT"]
            SkiaInclude = $envMap["MOUI_SKIA_SKIA_INCLUDE"]
            SkiaLibDir = $envMap["MOUI_SKIA_SKIA_LIB_DIR"]
            SkiaProvider = "release"
            SkiaLinkMode = $envMap["MOUI_SKIA_LINK_MODE"]
            ReleaseOwner = $envMap["MOUI_SKIA_RELEASE_OWNER"]
            ReleaseRepo = $envMap["MOUI_SKIA_RELEASE_REPO"]
            ReleaseTag = $envMap["MOUI_SKIA_RELEASE_TAG"]
            ReleaseUrl = $envMap["MOUI_SKIA_RELEASE_URL"]
            SkiaCommit = $envMap["MOUI_SKIA_SKIA_COMMIT"]
            SkiaPackage = $envMap["MOUI_SKIA_SKIA_PACKAGE"]
            SkiaPackageSha256 = $envMap["MOUI_SKIA_SKIA_PACKAGE_SHA256"]
            VcVarsAll = $env:VCVARSALL
            VcArch = "x64"
          }
          if (![string]::IsNullOrWhiteSpace($envMap["MOUI_SKIA_EXTRA_CC_FLAGS"])) {
            $acceptArgs["ExtraCcFlags"] = $envMap["MOUI_SKIA_EXTRA_CC_FLAGS"]
          }
          if (![string]::IsNullOrWhiteSpace($envMap["MOUI_SKIA_EXTRA_LINK_FLAGS"])) {
            $acceptArgs["ExtraLinkFlags"] = $envMap["MOUI_SKIA_EXTRA_LINK_FLAGS"]
          }
          .\scripts\windows-msvc-accept-real-skia-smoke.ps1 @acceptArgs

      - name: Verify real Skia artifact bundle
        shell: pwsh
        run: .\scripts\verify-real-skia-artifact.ps1 -Platform windows -LogDir logs

      - name: Verify platform status can be accepted
        shell: pwsh
        run: |
          $beforeStatus = Get-Content -LiteralPath skia-platform-status.json -Raw
          .\scripts\accept-platform-status.ps1 `
            -Platform windows `
            -LogDir logs `
            -ArtifactLabel "github-actions:${env:GITHUB_RUN_ID}:windows-real-skia-acceptance:${{ matrix.link_mode }}"
          git diff -- skia-platform-status.json | Out-File -FilePath logs\windows-platform-acceptance.patch -Encoding utf8
          [System.IO.File]::WriteAllText(
            (Resolve-Path -LiteralPath skia-platform-status.json).Path,
            $beforeStatus,
            [System.Text.UTF8Encoding]::new($false)
          )
          if ((Get-Item -LiteralPath logs\windows-platform-acceptance.patch).Length -eq 0) {
            throw "windows-platform-acceptance.patch was empty"
          }

      - name: Verify package files restored
        if: ${{ always() }}
        shell: pwsh
        run: git diff --exit-code -- native/moon.pkg scripts/native_smoke/moon.pkg

      - name: Upload Windows acceptance logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-real-skia-acceptance-log-${{ matrix.link_mode }}
          path: |
            moui_skia/logs/windows-real-skia-smoke-preflight.log
            moui_skia/logs/windows-real-skia-smoke.log
            moui_skia/logs/windows-native-smoke-output.log
            moui_skia/logs/windows-real-skia-acceptance.log
            moui_skia/logs/windows-platform-acceptance.patch
          if-no-files-found: warn
