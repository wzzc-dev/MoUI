name: MoUI Feature Proof Summary

on:
  workflow_run:
    workflows: ["MoUI CI", "MoUI Skia Real-Skia Smoke"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Specific ci.yml run_id to summarize. Defaults to latest.
        required: false
        default: ""

jobs:
  summarize:
    name: Feature proof summary
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Collect CI workflow statuses
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Determine head SHA from the triggering workflow_run, or from
            // workflow_dispatch inputs, or fall back to the latest ci.yml run.
            let headSha;
            let runId;
            let ciRun;

            if (context.eventName === 'workflow_dispatch' && '${{ inputs.ci_run_id }}' !== '') {
              runId = parseInt('${{ inputs.ci_run_id }}');
              ciRun = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: runId,
              });
              headSha = ciRun.data.head_sha;
            } else if (context.payload.workflow_run) {
              headSha = context.payload.workflow_run.head_sha;
              // Find the ci.yml run for this SHA
              const ciRuns = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: 'ci.yml',
                per_page: 10,
              });
              const matchingCiRun = ciRuns.data.workflow_runs.find(
                r => r.head_sha === headSha
              );
              if (matchingCiRun) {
                // If triggered by a non-ci.yml workflow (e.g. Skia smoke) and
                // ci.yml hasn't completed yet, skip this run to avoid a race
                // condition where ci.yml jobs have null conclusion and would
                // be treated as "missing", failing the verification.
                if (context.payload.workflow_run.name !== 'MoUI CI' &&
                    matchingCiRun.status !== 'completed') {
                  core.info('ci.yml run ' + matchingCiRun.id + ' is still ' +
                            matchingCiRun.status + ' — skipping summary to ' +
                            'avoid race condition. The summary will run again ' +
                            'when ci.yml completes.');
                  core.setOutput('skipped', 'true');
                  process.exit(0);
                }
                runId = matchingCiRun.id;
                ciRun = matchingCiRun;
              } else {
                core.setFailed('No ci.yml run found for SHA ' + headSha);
                return;
              }
            } else {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: 'ci.yml',
                per_page: 1,
              });
              if (runs.data.workflow_runs.length === 0) {
                core.setFailed('No ci.yml runs found');
                return;
              }
              runId = runs.data.workflow_runs[0].id;
              ciRun = runs.data.workflow_runs[0];
              headSha = ciRun.head_sha;
            }

            // Collect ci.yml job statuses
            const ciJobs = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: runId,
            });
            const status = {};
            // Map display names to short keys used by generate-feature-proof-report.mjs
            const jobNameToKey = {
              "Core conformance": "conformance",
              "Public API surface": "api-surface",
              "Linux platform contracts": "linux-platform",
              "macOS packaging smoke": "macos-packaging",
              "Benchmark scaffold": "benchmark-scaffold",
              "Windows MSVC native smoke": "windows-native",
              "macOS real-Skia smoke": "macos-real-skia",
              "Linux real-Skia smoke": "linux-real-skia",
              "Windows real-Skia smoke": "windows-real-skia",
            };
            for (const job of ciJobs.data.jobs) {
              const key = jobNameToKey[job.name] ?? job.name;
              status[key] = job.conclusion;
            }

            // Collect completed Skia smoke job statuses for the same SHA.
            // Only accept completed runs to avoid the race condition where ci.yml
            // finishes before Skia smoke is done (in-progress jobs have null
            // conclusion, which would mark L2 features as failed instead of skipped).
            // Only successful runs are collected so that failed Skia smoke runs
            // are treated as "skipped" (no proof) rather than "failed", keeping
            // the verification focused on L1 gaps. Skia smoke failures are
            // tracked by the Skia smoke workflow itself.
            try {
              const skiaRuns = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: 'moui-skia-real-skia-pr-smoke.yml',
                per_page: 10,
              });
              const matchingSkiaRun = skiaRuns.data.workflow_runs.find(
                r => r.head_sha === headSha && r.conclusion === "success"
              );
              if (matchingSkiaRun) {
                const skiaJobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner, repo,
                  run_id: matchingSkiaRun.id,
                });
                for (const job of skiaJobs.data.jobs) {
                  const key = jobNameToKey[job.name] ?? job.name;
                  status[key] = job.conclusion;
                }
              }
            } catch (e) {
              // Skia smoke workflow may not have runs yet
            }

            core.setOutput('status', JSON.stringify(status));
            core.setOutput('run_id', String(runId));
            core.setOutput('html_url', ciRun.html_url);

      - name: Generate feature proof report
        if: ${{ steps.collect.outputs.skipped != 'true' }}
        env:
          JOB_STATUS: ${{ steps.collect.outputs.status }}
          RUN_URL: ${{ steps.collect.outputs.html_url }}
        run: |
          mkdir -p artifacts/feature-proof
          node scripts/generate-feature-proof-report.mjs \
            --status "$JOB_STATUS" \
            --run-url "$RUN_URL" \
            --output artifacts/feature-proof/proof-report.json

      - name: Verify feature proof coverage
        if: ${{ steps.collect.outputs.skipped != 'true' }}
        run: |
          node scripts/verify-feature-proof-coverage.mjs \
            --report artifacts/feature-proof/proof-report.json

      - name: Upload feature proof summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-proof-summary
          path: artifacts/feature-proof/
          if-no-files-found: warn

      - name: Write summary
        if: ${{ always() && steps.collect.outputs.skipped != 'true' }}
        run: |
          echo "## Feature Proof Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat artifacts/feature-proof/proof-report.md >> $GITHUB_STEP_SUMMARY

      - name: Write skipped summary
        if: ${{ always() && steps.collect.outputs.skipped == 'true' }}
        run: |
          echo "## Feature Proof Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Skipped — ci.yml still in progress. Will run again when ci.yml completes." >> $GITHUB_STEP_SUMMARY
