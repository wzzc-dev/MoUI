<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoUI Website Wasm GC</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='28' font-family='Arial' font-weight='700' fill='%23ffffff'%3EM%3C/text%3E%3C/svg%3E" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #f6f7f9;
        color: #111111;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      }

      #renderer-badge {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 6px 12px;
        border-radius: 6px;
        font: 11px/1.4 "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 0, 0, 0.12);
        color: #555;
        pointer-events: none;
        user-select: none;
      }

      body.canvas2d #renderer-badge {
        display: block;
        background: rgba(255, 247, 237, 0.9);
        border-color: rgba(234, 179, 8, 0.3);
        color: #92400e;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
        outline: none;
        touch-action: none;
      }

      #canvas-host {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .moui-text-selection-layer {
        overflow: hidden;
        pointer-events: none;
        cursor: default;
        user-select: text;
        -webkit-user-select: text;
      }

      .moui-text-selection-layer span {
        pointer-events: auto;
        user-select: text;
        -webkit-user-select: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        white-space: pre;
        cursor: inherit;
        font-kerning: none;
        font-variant-ligatures: none;
        font-feature-settings: "kern" 0, "liga" 0, "clig" 0, "calt" 0;
        text-rendering: geometricPrecision;
      }

      .moui-text-selection-layer span::selection {
        background: rgba(37, 99, 235, 0.24);
        color: transparent;
        -webkit-text-fill-color: transparent;
      }

      #diagnostics {
        display: none;
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: min(520px, calc(100vw - 24px));
        max-height: 40vh;
        overflow: auto;
        padding: 12px;
        border: 1px solid rgba(0, 0, 0, 0.16);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.14);
        font: 12px/1.45 "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
      }

      body.debug #diagnostics,
      body.failed #diagnostics {
        display: block;
      }

      #status {
        font-weight: 600;
        margin-bottom: 8px;
      }

      #log {
        margin: 0;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="canvas-host" aria-label="MoUI website canvas host"></div>
    <aside id="diagnostics" aria-live="polite">
      <div id="status">Loading wasm-gc...</div>
      <pre id="log"></pre>
    </aside>
    <div id="renderer-badge">Canvas2D</div>

    <script type="module">
      import { bootMouiWasmGcApp } from "../../moui_web_renderer/runtime.js";

      if (new URLSearchParams(window.location.search).get("debug") === "1") {
        document.body.classList.add("debug");
      }

      const status = document.querySelector("#status");
      const log = document.querySelector("#log");
      let line = "";

      const append = message => {
        log.textContent += `${message}\n`;
        log.scrollTop = log.scrollHeight;
      };

      const setStatus = message => {
        status.textContent = message;
        append(message);
        // Show Canvas2D badge if we detect fallback
        if (message === "WebGPU unavailable; switching to Canvas2D renderer.") {
          document.body.classList.add("canvas2d");
        }
      };

      bootMouiWasmGcApp({
        wasmUrl: new URL(
          "../../_build/wasm-gc/debug/build/website/web_wasm/web_wasm.wasm",
          import.meta.url,
        ),
        canvasHost: "#canvas-host",
        webgpu: {
          textSelection: {
            enabled: true,
          },
        },
        onStatus: setStatus,
        onPrint(ch) {
          if (ch === "\n") {
            append(line);
            line = "";
          } else {
            line += ch;
          }
        },
      }).then(() => {
        status.textContent = "Running";
        append("MoonBit wasm-gc started.");
        // Keep canvas filling the viewport and notify MoonBit runtime
        const canvas = document.querySelector("canvas");
        const host = document.getElementById("canvas-host");
        console.log('[BOOT-DEBUG] .then() fired:', {
          hasCanvas: !!canvas,
          hasHost: !!host,
          canvas: canvas ? { id: canvas.id, w: canvas.width, h: canvas.height, clientW: canvas.clientWidth, clientH: canvas.clientHeight, styleW: canvas.style.width, styleH: canvas.style.height } : null,
          host: host ? { clientW: host.clientWidth, clientH: host.clientHeight } : null,
          window: { innerW: window.innerWidth, innerH: window.innerHeight, dpr: window.devicePixelRatio },
        });
        // Dispatch initial resize so MoonBit runtime uses viewport size
        if (canvas && host) {
          const resizeCanvasToViewport = () => {
            const w = host.clientWidth || window.innerWidth || 1;
            const h = host.clientHeight || window.innerHeight || 1;
            const dpr = window.devicePixelRatio || 1;
            console.log('[BOOT-DEBUG] resizeCanvasToViewport before:', { targetW: w, targetH: h, canvasW: canvas.width, canvasH: canvas.height });
            if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
              canvas.width = Math.max(1, Math.round(w * dpr));
              canvas.height = Math.max(1, Math.round(h * dpr));
              canvas.style.width = `${w}px`;
              canvas.style.height = `${h}px`;
              console.log('[BOOT-DEBUG] resizeCanvasToViewport after resize:', { w: canvas.width, h: canvas.height, styleW: canvas.style.width, styleH: canvas.style.height, clientW: canvas.clientWidth, clientH: canvas.clientHeight });
            } else {
              console.log('[BOOT-DEBUG] resizeCanvasToViewport: no change needed');
            }
            // Dispatch synthetic resize to notify MoonBit runtime
            console.log('[BOOT-DEBUG] dispatching window.resize event...');
            window.dispatchEvent(new Event("resize"));
            console.log('[BOOT-DEBUG] after dispatchEvent, canvas:', { w: canvas.width, h: canvas.height, clientW: canvas.clientWidth, clientH: canvas.clientHeight });
          };
          // Fire immediately to set initial size
          resizeCanvasToViewport();
          // Also observe for future resizes
          if (typeof ResizeObserver === "function") {
            console.log('[BOOT-DEBUG] setting up ResizeObserver');
            const ro = new ResizeObserver(entries => {
              console.log('[BOOT-DEBUG] ResizeObserver fired:', entries.map(e => ({ contentRect: e.contentRect })));
              resizeCanvasToViewport();
            });
            ro.observe(host);
          }
        }
      }).catch(error => {
        document.body.classList.add("failed");
        status.textContent = "Failed";
        append(error.stack || String(error));
        console.error(error);
      });
    </script>
  </body>
</html>
