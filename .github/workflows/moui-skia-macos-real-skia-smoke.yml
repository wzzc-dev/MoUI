name: MoUI Skia macOS Real Skia Smoke

on:
  workflow_dispatch:
    inputs:
      skia_rev:
        description: Skia revision, branch, or tag to build; empty uses skia-revision.txt
        required: false
        default: ""
      skia_provider:
        description: Skia provider to use
        type: choice
        required: false
        default: release
        options:
          - release
          - source
          - existing
      link_mode:
        description: Skia release link mode
        type: choice
        required: false
        default: static
        options:
          - static
          - dynamic
          - auto
      skia_include:
        description: Existing Skia checkout/include root; falls back to MOUI_SKIA_SKIA_INCLUDE on the runner
        required: false
        default: ""
      skia_lib_dir:
        description: Existing directory containing libskia.a or libskia.dylib; falls back to MOUI_SKIA_SKIA_LIB_DIR on the runner
        required: false
        default: ""
      skia_lib:
        description: Library name without lib prefix
        required: false
        default: skia
      extra_gn_args:
        description: Extra GN args for source-built Skia
        required: false
        default: ""
      extra_cc_flags:
        description: Extra C/C++ flags for the MoonBit native stub
        required: false
        default: ""
      extra_link_flags:
        description: Extra linker flags for the smoke executable
        required: false
        default: ""
      enable_asan:
        description: Enable AddressSanitizer for the native smoke helper
        type: boolean
        required: false
        default: false
      dry_run_config:
        description: Print resolved config without building Skia or rewriting package files
        type: boolean
        required: false
        default: false

jobs:
  smoke:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: moui_skia
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Preflight smoke configuration
        shell: bash
        env:
          SKIA_REV: ${{ inputs.skia_rev }}
          SKIA_PROVIDER: ${{ inputs.skia_provider }}
          LINK_MODE: ${{ inputs.link_mode }}
          SKIA_INCLUDE: ${{ inputs.skia_include }}
          SKIA_LIB_DIR: ${{ inputs.skia_lib_dir }}
          SKIA_LIB: ${{ inputs.skia_lib }}
          EXTRA_GN_ARGS: ${{ inputs.extra_gn_args }}
          EXTRA_CC_FLAGS: ${{ inputs.extra_cc_flags }}
          EXTRA_LINK_FLAGS: ${{ inputs.extra_link_flags }}
          ENABLE_ASAN: ${{ inputs.enable_asan }}
        run: |
          mkdir -p logs
          args=(--dry-run-config --skia-provider "$SKIA_PROVIDER")
          if [[ -n "$LINK_MODE" ]]; then
            args+=(--link-mode "$LINK_MODE")
          fi
          if [[ -n "$SKIA_REV" ]]; then
            args+=(--skia-rev "$SKIA_REV")
          fi
          if [[ -n "$SKIA_INCLUDE" || -n "$SKIA_LIB_DIR" ]]; then
            args+=(--skia-include "$SKIA_INCLUDE")
            args+=(--skia-lib-dir "$SKIA_LIB_DIR")
          fi
          if [[ -n "$SKIA_LIB" ]]; then
            args+=(--skia-lib "$SKIA_LIB")
          fi
          if [[ -n "$EXTRA_GN_ARGS" ]]; then
            args+=(--extra-gn-args "$EXTRA_GN_ARGS")
          fi
          if [[ -n "$EXTRA_CC_FLAGS" ]]; then
            args+=(--extra-cc-flags "$EXTRA_CC_FLAGS")
          fi
          if [[ -n "$EXTRA_LINK_FLAGS" ]]; then
            args+=(--extra-link-flags "$EXTRA_LINK_FLAGS")
          fi
          if [[ "$ENABLE_ASAN" == "true" ]]; then
            args+=(--enable-asan)
          fi
          set -o pipefail
          bash scripts/macos-real-skia-smoke.sh "${args[@]}" 2>&1 | tee logs/macos-real-skia-smoke-preflight.log

      - name: Set up MoonBit
        if: ${{ !inputs.dry_run_config }}
        uses: ./.github/actions/setup-moonbit

      - name: Update MoonBit registry
        if: ${{ !inputs.dry_run_config }}
        shell: bash
        run: moon update

      - name: Install build dependencies
        if: ${{ !inputs.dry_run_config }}
        shell: bash
        run: brew install ninja

      - name: Cache Skia checkout and build
        if: ${{ !inputs.dry_run_config && inputs.skia_provider == 'source' && inputs.skia_include == '' && inputs.skia_lib_dir == '' }}
        uses: actions/cache@v4
        with:
          path: moui_skia/.skia-cache/macos
          key: skia-macos-${{ inputs.skia_rev || hashFiles('moui_skia/skia-revision.txt') }}-${{ hashFiles('moui_skia/scripts/macos-build-skia.sh', 'moui_skia/scripts/macos-real-skia-smoke.sh', 'moui_skia/scripts/macos-skia-smoke.sh') }}
          restore-keys: |
            skia-macos-${{ inputs.skia_rev || hashFiles('moui_skia/skia-revision.txt') }}-
            skia-macos-

      - name: Cache release Skia
        if: ${{ !inputs.dry_run_config && inputs.skia_provider == 'release' && inputs.skia_include == '' && inputs.skia_lib_dir == '' }}
        uses: actions/cache@v4
        with:
          path: moui_skia/.skia-cache/release
          key: release-skia-macos-${{ inputs.link_mode }}-${{ runner.arch }}-${{ hashFiles('moui_skia/skia-provider-lock.json') }}
          restore-keys: |
            release-skia-macos-${{ inputs.link_mode }}-${{ runner.arch }}-
            release-skia-macos-${{ inputs.link_mode }}-
            release-skia-macos-

      - name: Run native smoke test
        shell: bash
        env:
          SKIA_INCLUDE: ${{ inputs.skia_include }}
          SKIA_LIB_DIR: ${{ inputs.skia_lib_dir }}
          SKIA_PROVIDER: ${{ inputs.skia_provider }}
          LINK_MODE: ${{ inputs.link_mode }}
          SKIA_REV: ${{ inputs.skia_rev }}
          SKIA_LIB: ${{ inputs.skia_lib }}
          EXTRA_GN_ARGS: ${{ inputs.extra_gn_args }}
          EXTRA_CC_FLAGS: ${{ inputs.extra_cc_flags }}
          EXTRA_LINK_FLAGS: ${{ inputs.extra_link_flags }}
          ENABLE_ASAN: ${{ inputs.enable_asan }}
          DRY_RUN_CONFIG: ${{ inputs.dry_run_config }}
        run: |
          mkdir -p logs
          if [[ "$DRY_RUN_CONFIG" == "true" ]]; then
            echo "dry_run_config=true; real macOS smoke was not run" | tee logs/macos-real-skia-smoke.log
            exit 0
          fi
          args=(--skia-provider "$SKIA_PROVIDER")
          if [[ -n "$LINK_MODE" ]]; then
            args+=(--link-mode "$LINK_MODE")
          fi
          if [[ -n "$SKIA_INCLUDE" || -n "$SKIA_LIB_DIR" ]]; then
            args+=(--skia-include "$SKIA_INCLUDE")
            args+=(--skia-lib-dir "$SKIA_LIB_DIR")
          fi
          args+=(--skia-lib "$SKIA_LIB")
          if [[ -n "$SKIA_REV" ]]; then
            args+=(--skia-rev "$SKIA_REV")
          fi
          if [[ -n "$EXTRA_GN_ARGS" ]]; then
            args+=(--extra-gn-args "$EXTRA_GN_ARGS")
          fi
          if [[ -n "$EXTRA_CC_FLAGS" ]]; then
            args+=(--extra-cc-flags "$EXTRA_CC_FLAGS")
          fi
          if [[ -n "$EXTRA_LINK_FLAGS" ]]; then
            args+=(--extra-link-flags "$EXTRA_LINK_FLAGS")
          fi
          if [[ "$ENABLE_ASAN" == "true" ]]; then
            args+=(--enable-asan)
          fi
          bash scripts/macos-accept-real-skia-smoke.sh --log-dir logs "${args[@]}"

      - name: Verify native smoke success marker
        if: ${{ always() && !inputs.dry_run_config }}
        shell: bash
        run: bash scripts/verify-native-smoke-log.sh logs/macos-native-smoke-output.log

      - name: Verify acceptance summary
        if: ${{ always() && !inputs.dry_run_config }}
        shell: bash
        run: bash scripts/verify-acceptance-log.sh logs/macos-real-skia-acceptance.log

      - name: Verify real Skia artifact bundle
        if: ${{ always() && !inputs.dry_run_config }}
        shell: bash
        run: bash scripts/verify-real-skia-artifact.sh --platform macos --log-dir logs

      - name: Verify pinned Skia revision match
        if: ${{ always() && !inputs.dry_run_config && inputs.skia_provider == 'source' }}
        shell: bash
        run: bash scripts/verify-skia-revision-pin.sh logs/macos-real-skia-acceptance.log --skip-if-unpinned

      - name: Upload smoke log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-real-skia-smoke-log
          path: |
            moui_skia/logs/macos-real-skia-smoke-preflight.log
            moui_skia/logs/macos-skia-build.log
            moui_skia/logs/macos-real-skia-smoke.log
            moui_skia/logs/macos-native-smoke-output.log
            moui_skia/logs/macos-real-skia-acceptance.log
          if-no-files-found: warn

      - name: Verify package files restored
        if: ${{ always() }}
        shell: bash
        run: |
          restore_status="${restore_status:-passed}"
          if [[ -f native/moon.pkg.smoke.bak ]]; then
            echo "native/moon.pkg smoke backup is still present" >&2
            restore_status="failed"
          fi
          if [[ -f scripts/native_smoke/moon.pkg.smoke.bak ]]; then
            echo "scripts/native_smoke/moon.pkg smoke backup is still present" >&2
            restore_status="failed"
          fi
          if ! git diff --exit-code -- native/moon.pkg scripts/native_smoke/moon.pkg; then
            echo "package files differ after macOS Skia smoke" >&2
            restore_status="failed"
          fi
          echo "restore_status=$restore_status" >> "$GITHUB_ENV"
          if [[ "$restore_status" != "passed" ]]; then
            exit 1
          fi

      - name: Write workflow summary
        if: ${{ always() }}
        shell: bash
        env:
          SKIA_REV: ${{ inputs.skia_rev }}
          SKIA_PROVIDER: ${{ inputs.skia_provider }}
          LINK_MODE: ${{ inputs.link_mode }}
          SKIA_INCLUDE: ${{ inputs.skia_include }}
          SKIA_LIB_DIR: ${{ inputs.skia_lib_dir }}
          SKIA_LIB: ${{ inputs.skia_lib }}
          EXTRA_GN_ARGS: ${{ inputs.extra_gn_args }}
          EXTRA_CC_FLAGS: ${{ inputs.extra_cc_flags }}
          EXTRA_LINK_FLAGS: ${{ inputs.extra_link_flags }}
          ENABLE_ASAN: ${{ inputs.enable_asan }}
          DRY_RUN_CONFIG: ${{ inputs.dry_run_config }}
        run: |
          resolved_commit="not run"
          if [[ -n "${macos_skia_commit:-}" ]]; then
            resolved_commit="$macos_skia_commit"
          elif [[ -f logs/macos-real-skia-smoke.log ]]; then
            resolved_commit="$(grep -E '^[[:space:]]*skia_commit=' logs/macos-real-skia-smoke.log | tail -n 1 | sed 's/^[[:space:]]*skia_commit=//' || true)"
          fi
          {
            echo "## macOS Real Skia Smoke"
            echo ""
            echo "- Dry run only: ${DRY_RUN_CONFIG:-false}"
            if [[ -n "$SKIA_INCLUDE" || -n "$SKIA_LIB_DIR" ]]; then
              echo "- Mode: existing Skia build"
            elif [[ "$SKIA_PROVIDER" == "release" ]]; then
              echo "- Mode: GitHub release Skia binary"
            else
              echo "- Mode: source-built Skia"
            fi
            echo "- Skia provider: ${SKIA_PROVIDER:-release}"
            echo "- Skia link mode: ${LINK_MODE:-static}"
            echo "- Skia revision: ${SKIA_REV:-<skia-revision.txt>}"
            echo "- Resolved Skia commit: ${resolved_commit:-not run}"
            echo "- Skia include: ${SKIA_INCLUDE:-<source build>}"
            echo "- Skia lib dir: ${SKIA_LIB_DIR:-<source build>}"
            echo "- Skia library: ${SKIA_LIB:-skia}"
            echo "- Extra GN args: ${EXTRA_GN_ARGS:-<none>}"
            echo "- Extra C/C++ flags: ${EXTRA_CC_FLAGS:-<none>}"
            echo "- Extra link flags: ${EXTRA_LINK_FLAGS:-<none>}"
            echo "- AddressSanitizer: ${ENABLE_ASAN:-false}"
            echo "- Artifact: macos-real-skia-smoke-log"
            echo "- Preflight log: logs/macos-real-skia-smoke-preflight.log"
            echo "- Build log: logs/macos-skia-build.log"
            echo "- Smoke log: logs/macos-real-skia-smoke.log"
            echo "- Native smoke executable log: logs/macos-native-smoke-output.log"
            echo "- Acceptance log: logs/macos-real-skia-acceptance.log"
            echo "- Native smoke success marker: ${native_smoke_marker_status:-not run}"
            echo "- native/moon.pkg restore check: ${restore_status:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"
