name: Set up MoonBit
description: Install the repository-pinned MoonBit toolchain.

inputs:
  toolchain-file:
    description: Path to the MoonBit toolchain version file, relative to the workspace root.
    required: false
    default: .moonbit-toolchain

runs:
  using: composite
  steps:
    - name: Set up MoonBit on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        toolchain_file="$GITHUB_WORKSPACE/${{ inputs.toolchain-file }}"
        version="$(awk 'NF && $1 !~ /^#/ { print $1; exit }' "$toolchain_file")"
        if [[ -z "$version" ]]; then
          echo "::error::MoonBit toolchain file is empty: $toolchain_file" >&2
          exit 1
        fi
        echo "Installing MoonBit toolchain $version"
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$version"
        version_log="${RUNNER_TEMP:-/tmp}/moui-moonbit-version.txt"
        "$HOME/.moon/bin/moon" version --all | tee "$version_log"
        if ! grep -Fq "$version" "$version_log"; then
          echo "::error::Installed MoonBit toolchain does not match $version" >&2
          exit 1
        fi
        echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

    - name: Set up MoonBit on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $toolchainFile = Join-Path $env:GITHUB_WORKSPACE "${{ inputs.toolchain-file }}"
        $version = Get-Content -LiteralPath $toolchainFile |
          Where-Object {
            $line = $_.Trim()
            $line.Length -gt 0 -and -not $line.StartsWith("#")
          } |
          Select-Object -First 1
        if ($null -eq $version) {
          throw "MoonBit toolchain file is empty: $toolchainFile"
        }
        $version = $version.Trim()
        $expectedVersion = $version
        Write-Host "Installing MoonBit toolchain $expectedVersion"
        $env:MOONBIT_INSTALL_VERSION = $expectedVersion
        Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
        $moon = Join-Path $env:USERPROFILE ".moon\bin\moon.exe"
        $versionOutput = & $moon version --all | Out-String
        Write-Host $versionOutput
        if (!$versionOutput.Contains($expectedVersion)) {
          throw "Installed MoonBit toolchain does not match $expectedVersion"
        }
        "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
